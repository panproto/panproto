[package]
name = "panproto-cli"
description = "Schematic version control CLI for panproto"
homepage = "https://github.com/panproto/panproto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# cargo-dist: this is the package that produces distributable binaries
[package.metadata.dist]
dist = true

[[bin]]
name = "schema"
path = "src/main.rs"

[dependencies]
# The `tree-sitter` feature links the grammars the schema readers of
# OpenAPI, AsyncAPI, JSON Schema, Kubernetes CRDs, CloudFormation, Ansible
# and PostgreSQL parse with, so `--protocol` reads every protocol.
panproto-core = { workspace = true, features = ["tree-sitter"] }
panproto-parse = { workspace = true }
panproto-project = { workspace = true }
panproto-git = { workspace = true }
clap = { workspace = true }
git2 = { workspace = true }
panproto-xrpc = { workspace = true }
panproto-vcs = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread"] }
rustyline = "18"
miette = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
blake3 = { workspace = true }
globset = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = { workspace = true }
panproto-core = { workspace = true }
rmp-serde = { workspace = true }

[lints]
workspace = true
