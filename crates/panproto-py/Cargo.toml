group-data = ["panproto-grammars/group-data", "panproto-parse/group-data"]
group-functional = ["panproto-grammars/group-functional", "panproto-parse/group-functional"]
group-devops = ["panproto-grammars/group-devops", "panproto-parse/group-devops"]
group-mobile = ["panproto-grammars/group-mobile", "panproto-parse/group-mobile"]
group-music = ["panproto-grammars/group-music", "panproto-parse/group-music"]
group-all = ["panproto-grammars/group-all", "panproto-parse/group-all"]
