[package]
name = "panproto-py"
description = "Native Python bindings for panproto via PyO3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
panproto-core = { workspace = true }
panproto-grammars = { workspace = true }
panproto-parse = { workspace = true }
panproto-project = { workspace = true }
panproto-git = { workspace = true }
git2 = { workspace = true }
tree-sitter = { workspace = true }
rustc-hash = { workspace = true }
pyo3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
yaml_serde = "0.10"
pythonize = { workspace = true }

# ─── Grammar feature passthrough ──────────────────────────────────────
#
# Forwards each `panproto-grammars` / `panproto-parse` group and
# per-language flag so consumers building the wheel can pick a grammar
# bundle without modifying `panproto-grammars` itself. The published
# wheel ships with `--features group-all` to expose all 248 grammars
# from Python; downstream Rust consumers depending on `panproto-py`
# directly can still opt into a smaller bundle (`group-core`,
# `lang-haskell`, …) to keep build times and binary size down.

[features]
default = ["group-core"]
group-core = ["panproto-grammars/group-core", "panproto-parse/group-core"]
group-web = ["panproto-grammars/group-web", "panproto-parse/group-web"]
group-systems = ["panproto-grammars/group-systems", "panproto-parse/group-systems"]
group-jvm = ["panproto-grammars/group-jvm", "panproto-parse/group-jvm"]
