[package]
name = "panproto-project"
description = "Multi-file project assembly via schema coproduct for panproto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
panproto-gat = { workspace = true }
panproto-schema = { workspace = true }
panproto-protocols = { workspace = true }
panproto-parse = { workspace = true }
panproto-vcs = { workspace = true }

thiserror = { workspace = true }
miette = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
globset = { workspace = true }
blake3 = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
divan = { workspace = true }

[[bench]]
name = "project_bench"
harness = false
required-features = ["panproto-parse/lang-protobuf"]

[[example]]
name = "assemble_protos"
required-features = ["panproto-parse/lang-protobuf"]

[lints]
workspace = true
