[package]
name = "panproto-mig"
description = "Migration engine for panproto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
panproto-inst = { workspace = true }
panproto-schema = { workspace = true }
panproto-gat = { workspace = true }
panproto-expr = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
smallvec = { workspace = true }
blake3 = { workspace = true }

[features]
default = []
# Compiles `solve::oracle`, the exhaustive enumerator. It is a measuring
# instrument rather than a solver: another crate turns it on to check a search
# path against the true optimum, and nothing turns it on in a release build.
oracle = []

[dev-dependencies]
proptest = { workspace = true }
smallvec = { workspace = true }
serde_json = { workspace = true }
divan = { workspace = true }
insta = { workspace = true }
# The measured corpus is the atproto lexicon set, and reading it needs the
# protocol that parses it. Tests and benches only: `panproto-protocols` depends
# on `panproto-schema` and not on this crate, so the dev-only edge is acyclic.
panproto-protocols = { workspace = true }

[[bench]]
name = "span_bench"
harness = false

[lints]
workspace = true
