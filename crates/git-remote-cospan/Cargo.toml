[package]
name = "git-remote-cospan"
description = "Git remote helper for cospan:// URLs (enables git push/pull/clone via panproto)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = true

[[bin]]
name = "git-remote-cospan"
path = "src/main.rs"

[dependencies]
panproto-vcs = { workspace = true }
panproto-git = { workspace = true }
panproto-xrpc = { version = "0.29.0", path = "../panproto-xrpc" }

git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
rustc-hash = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
miette = { workspace = true }

[dev-dependencies]
tempfile = "3"
panproto-protocols = { workspace = true }
panproto-schema = { workspace = true }

[lints]
workspace = true
