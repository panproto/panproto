[package]
name = "panproto-gat-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Proc-macro surface for declarative class and instance syntax targeting panproto-gat."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }

[dev-dependencies]
panproto-gat = { workspace = true }
trybuild = "1"

[lints]
workspace = true
