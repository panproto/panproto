[package]
name = "panproto-git-remote"
description = "Git remote helper for panproto:// URLs (enables git push/pull/clone via panproto)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = true

[[bin]]
name = "git-remote-panproto"
path = "src/main.rs"

[dependencies]
panproto-vcs = { workspace = true }
panproto-git = { workspace = true }
panproto-xrpc = { workspace = true }

git2 = { workspace = true }
rustc-hash = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
miette = { workspace = true }

[dev-dependencies]
tempfile = "3"
panproto-protocols = { workspace = true }
panproto-schema = { workspace = true }

[lints]
workspace = true
