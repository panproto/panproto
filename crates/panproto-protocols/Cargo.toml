[package]
name = "panproto-protocols"
description = "Built-in protocol definitions for panproto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
panproto-gat = { workspace = true }
# The shared resource-limits policy every public parse charges against.
panproto-expr = { workspace = true }
panproto-schema = { workspace = true }
panproto-inst = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
blake3 = { workspace = true }
smallvec = { workspace = true }
# The frozen theory composition corpus is written in named MessagePack and
# CBOR by the `theory-composition-fixtures` binary.
rmp-serde = { workspace = true }
ciborium = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
divan = { workspace = true }

[[bench]]
name = "protocols_bench"
harness = false

[lints]
workspace = true
