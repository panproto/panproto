[package]
name = "panproto-protocols"
description = "Built-in protocol definitions for panproto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
panproto-gat = { workspace = true }
panproto-schema = { workspace = true }
panproto-inst = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rustc-hash = { workspace = true }
blake3 = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]
# Needed only to build a `CoercionSpec` in tests: the spec's expressions
# are `panproto_expr::Expr`, which this crate otherwise only ever passes
# through.
panproto-expr = { workspace = true }
proptest = { workspace = true }
divan = { workspace = true }

[[bench]]
name = "protocols_bench"
harness = false

[lints]
workspace = true
