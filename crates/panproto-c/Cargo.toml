[package]
name = "panproto-c"
description = "C ABI for panproto, used by language bindings (Haskell first, others welcome)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
panproto-core = { workspace = true }
panproto-expr = { workspace = true }
panproto-expr-parser = { workspace = true }
panproto-lens-dsl = { workspace = true }
safer-ffi = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }
# Only pulled in under the `git` feature: opening the on-disk repository
# is done here, with the import driven by `panproto_core::git`. Vendored
# libgit2/openssl match the Python surface so the bridge builds without
# system git libraries.
git2 = { version = "0.21", optional = true, default-features = false, features = [
    "vendored-libgit2",
    "vendored-openssl",
] }

[dev-dependencies]
# Builds throwaway on-disk git repositories for the `git`-feature tests.
tempfile = "3"

[features]
default = []
# Enables the `generate_headers` test that writes the C header.
headers = ["safer-ffi/headers"]
# Exposes `pp_internal_panic` so external crates can verify panic
# safety end-to-end. Off by default; the symbol is always available
# under `cfg(test)` for in-crate tests.
panic-test = []
# Full-AST tree-sitter parsing (261 grammars). Adds C compilation deps.
full-parse = ["panproto-core/full-parse"]
# Multi-file project assembly via coproduct.
project = ["panproto-core/project"]
# Git bridge for bidirectional git <-> panproto-vcs translation.
git = ["panproto-core/git", "dep:git2"]
# Tree-sitter-based format-preserving instance parse/emit.
format-preserving = ["panproto-core/tree-sitter"]
# Convenience feature enabling every cold-path domain.
full = ["full-parse", "project", "git", "format-preserving"]

[lints]
workspace = true

[[test]]
name = "panic"
required-features = ["panic-test"]

