asyncapi: 3.0.0
info:
  title: Account Service
  version: 1.0.0
  description: |
    This service is in charge of processing user signups.
    Supports unicode: café, 世界.
servers:
  production:
    host: broker.example.com:5672
    protocol: amqp
channels:
  userSignedUp:
    address: user.signedup
    messages:
      userSignedUp:
        $ref: '#/components/messages/UserSignedUp'
operations:
  sendUserSignedUp:
    action: send
    channel:
      $ref: '#/channels/userSignedUp'
components:
  messages:
    UserSignedUp:
      payload:
        type: object
        properties:
          displayName:
            type: string
            examples:
              - Alice
          email:
            type: string
            format: email
          retries: 3      # inline comment preserved
