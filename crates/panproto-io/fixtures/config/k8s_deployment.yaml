apiVersion: apps/v1
kind: Deployment
metadata:
  name: panproto
  namespace: default
  labels:
    app: panproto
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: panproto
  template:
    metadata:
      labels:
        app: panproto
    spec:
      containers:
        - name: panproto
          image: ghcr.io/panproto/core:0.2.0
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "500m"
              memory: 256Mi
            requests:
              cpu: "100m"
              memory: 128Mi
          env:
            - name: LOG_LEVEL
              value: info
            - name: RUST_BACKTRACE
              value: "1"
