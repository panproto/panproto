[package]
name = "panproto-integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "panproto_integration"
path = "src/lib.rs"

# The lib target holds the shared proptest generators, so the crates it
# names must be normal dependencies: a lib target cannot reference
# dev-dependencies. Everything only the test binaries touch stays below.
[dependencies]
panproto-gat = { workspace = true }
panproto-schema = { workspace = true }
# The `oracle` feature compiles `panproto_mig::solve::oracle`, the exhaustive
# enumerator a search path is checked against. It lives behind a feature so a
# release build never carries it, and this crate is the one that turns it on.
panproto-mig = { workspace = true, features = ["oracle"] }
proptest = { workspace = true }

[dev-dependencies]
panproto-inst = { workspace = true }
panproto-protocols = { workspace = true }
panproto-lens = { workspace = true }
panproto-lens-dsl = { workspace = true }
panproto-check = { workspace = true }
panproto-project = { workspace = true }
panproto-vcs = { workspace = true }
panproto-core = { workspace = true }
panproto-expr = { workspace = true }
panproto-expr-parser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
smallvec = { workspace = true }
rustc-hash = { workspace = true }

[lints]
workspace = true
