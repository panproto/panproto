[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436) but is a transitive dep of
    # nickel-lang-core used only at Nickel evaluation time (not in hot paths).
    # No security impact; will be resolved when nickel-lang updates.
    "RUSTSEC-2024-0436",
    # quick-xml 0.37 denial-of-service advisories in namespace and duplicate-
    # attribute handling. panproto-io parses XML through the non-namespace
    # `quick_xml::Reader`, and RUSTSEC-2026-0195 explicitly states that a
    # `Reader` without namespace resolution is unaffected; RUSTSEC-2026-0194's
    # quadratic duplicate-attribute scan is bounded by schema-guided local
    # documents, not adversarial streams. Both are cleared by upgrading to
    # quick-xml 0.41, which is deferred to its own change because 0.41 splits
    # entity references into separate parse events and needs a text-pathway
    # migration.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
    # malachite crates are transitive deps of nickel-lang (arbitrary-precision
    # arithmetic in the Nickel evaluator). Dynamically linked per Rust default.
    "LGPL-3.0-only",
    # clipboard-win and error-code (windows-only transitive deps of rustyline,
    # which is used by the REPL in panproto-cli) ship under the Boost Software
    # License, a permissive MIT-compatible license.
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[[bans.skip]]
crate = "panproto-integration-tests"
reason = "internal test crate, publish = false"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
