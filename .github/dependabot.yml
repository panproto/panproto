version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    groups:
      rust-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /bindings/typescript
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - typescript
    groups:
      ts-deps:
        patterns:
          - "*"

  # Every action is pinned to a commit SHA with its version in a
  # trailing comment; Dependabot understands that form and bumps both.
  #
  # One file is not ours to bump: `release.yml` is generated by
  # `dist generate-ci`, and the Release workflow fails on a tag when the
  # file diverges from what cargo-dist would generate. A bump that
  # touches it must be followed by `dist generate-ci`, or closed. That
  # is why `release.yml` is the one workflow left on version tags.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
