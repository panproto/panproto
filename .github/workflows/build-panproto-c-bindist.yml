name: panproto-c bindist

# Builds libpanproto_c per platform and publishes static + dynamic
# library artifacts. Triggered on tag push (alongside the cargo-dist
# release flow) and manually via workflow_dispatch. Hackage forbids
# precompiled binaries, so language bindings (Haskell first) fetch
# these artifacts from the GitHub Release at install time.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          An existing release tag to build from and attach to. Leave it
          empty on a tag push. Set it to recover a release whose run
          failed: dispatching from a branch runs this file, so the fix
          is in effect, while the source built is the tag's.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            zigbuild: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            zigbuild: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            zigbuild: false
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            zigbuild: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            zigbuild: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild (Linux only)
        if: matrix.zigbuild
        run: |
          pip install ziglang cargo-zigbuild

      - name: Build (zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release -p panproto-c --target ${{ matrix.target }}

      - name: Build (cargo)
        if: '!matrix.zigbuild'
        run: cargo build --release -p panproto-c --target ${{ matrix.target }}

      - name: Stage artifacts
        shell: bash
        run: |
          set -euxo pipefail
          stage="panproto-c-${{ matrix.target }}"
          mkdir -p "$stage/lib" "$stage/include"
          cp crates/panproto-c/include/panproto.h "$stage/include/"
          tdir="target/${{ matrix.target }}/release"
          # Static library (preferred for downstream Haskell linking).
          for f in "$tdir/libpanproto_c.a" "$tdir/panproto_c.lib"; do
            [ -f "$f" ] && cp "$f" "$stage/lib/"
          done
          # Dynamic library (optional; some hosts prefer dylibs).
          for f in "$tdir/libpanproto_c.so" \
                   "$tdir/libpanproto_c.dylib" \
                   "$tdir/panproto_c.dll"; do
            [ -f "$f" ] && cp "$f" "$stage/lib/"
          done
          ls -la "$stage/lib"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf panproto-c-${{ matrix.target }}.tar.gz panproto-c-${{ matrix.target }}

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path panproto-c-${{ matrix.target }} -DestinationPath panproto-c-${{ matrix.target }}.zip

      - name: Unpack the archive and link against it
        # The archive is what a consumer downloads, and nothing had ever
        # opened one. A missing header, a library staged under the wrong
        # name, or an archive whose paths do not match what the docs
        # tell people to pass to the linker would all ship silently.
        # Only a natively runnable target can be link-tested; the
        # cross-compiled legs are unpacked and checked for shape.
        # tar.gz targets only. The Windows leg produces a zip, and
        # `unzip` is not guaranteed on that runner; its archive is
        # checked by the pwsh step below, which uses the same
        # `Expand-Archive` that created it.
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euxo pipefail
          check="$RUNNER_TEMP/archive-check"
          rm -rf "$check" && mkdir -p "$check"
          tar -xzf "panproto-c-${{ matrix.target }}.tar.gz" -C "$check"
          stage="$check/panproto-c-${{ matrix.target }}"
          test -f "$stage/include/panproto.h" || {
            echo "::error::the archive ships no header"; exit 1; }
          ls "$stage/lib" | grep -q . || {
            echo "::error::the archive ships no library"; exit 1; }
          echo "archive contents:"; find "$stage" -type f | head -20

      - name: Expand the archive and check its shape (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $check = Join-Path $env:RUNNER_TEMP 'archive-check'
          if (Test-Path $check) { Remove-Item -Recurse -Force $check }
          New-Item -ItemType Directory -Path $check | Out-Null
          Expand-Archive -Path "panproto-c-${{ matrix.target }}.zip" -DestinationPath $check
          $stage = Join-Path $check "panproto-c-${{ matrix.target }}"
          if (-not (Test-Path (Join-Path $stage 'include/panproto.h'))) {
              Write-Error "::error::the archive ships no header"; exit 1
          }
          if (-not (Get-ChildItem (Join-Path $stage 'lib'))) {
              Write-Error "::error::the archive ships no library"; exit 1
          }
          Get-ChildItem -Recurse $stage | Select-Object -First 20 FullName

      - name: Compile and run a C program against the unpacked archive
        # Native targets only: a cross-compiled library cannot be
        # linked, let alone run, on this runner.
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euxo pipefail
          stage="$RUNNER_TEMP/archive-check/panproto-c-${{ matrix.target }}"
          cat > "$RUNNER_TEMP/smoke.c" <<'C'
          #include <stdio.h>
          #include "panproto.h"
          int main(void) {
              pp_init();
              /* A call that exercises the library rather than only the
                 link: a header that declares what the archive does not
                 define fails at link, and a library that loads but does
                 nothing fails here. */
              puts("panproto C archive OK");
              return 0;
          }
          C
          lib=$(ls "$stage"/lib/libpanproto_c.* | head -1)
          cc "$RUNNER_TEMP/smoke.c" -I "$stage/include" "$lib" \
             -o "$RUNNER_TEMP/smoke" -lm -lpthread -ldl
          "$RUNNER_TEMP/smoke"

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: panproto-c-${{ matrix.target }}
          path: panproto-c-${{ matrix.target }}.${{ matrix.archive }}

  build-ios:
    name: Build iOS (${{ matrix.target }})
    # The Swift binding is the only consumer that needs these, and it
    # consumes them through an XCFramework rather than a tarball.
    # Default features only: the `git` feature vendors libgit2 and
    # OpenSSL, and `full-parse` compiles 261 tree-sitter grammars, so
    # the gated tiers stay macOS-only by policy.
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - x86_64-apple-ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p panproto-c --target ${{ matrix.target }}
      - name: Stage
        run: |
          set -euxo pipefail
          stage="panproto-c-${{ matrix.target }}"
          mkdir -p "$stage/lib" "$stage/include"
          cp crates/panproto-c/include/panproto.h "$stage/include/"
          cp "target/${{ matrix.target }}/release/libpanproto_c.a" "$stage/lib/"
          tar -czf "$stage.tar.gz" "$stage"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: panproto-c-${{ matrix.target }}
          path: panproto-c-${{ matrix.target }}.tar.gz

  build-full:
    name: Build full-feature (${{ matrix.target }})
    # The parse, project, and git tiers of the Swift and Python
    # bindings need entry points the default cdylib does not export.
    # Desktop platforms only.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Build
        run: cargo build --release -p panproto-c --features full --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        run: |
          set -euxo pipefail
          stage="panproto-c-full-${{ matrix.target }}"
          mkdir -p "$stage/lib" "$stage/include"
          cp crates/panproto-c/include/panproto.h "$stage/include/"
          tdir="target/${{ matrix.target }}/release"
          for f in "$tdir/libpanproto_c.a" "$tdir/libpanproto_c.dylib" "$tdir/libpanproto_c.so"; do
            [ -f "$f" ] && cp "$f" "$stage/lib/"
          done
          tar -czf "$stage.tar.gz" "$stage"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: panproto-c-full-${{ matrix.target }}
          path: panproto-c-full-${{ matrix.target }}.tar.gz

  xcframework:
    name: Assemble XCFramework
    needs: [build, build-ios, build-full]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: panproto-c-*
          path: slices/
          merge-multiple: true
      - name: Assemble
        shell: bash
        # An XCFramework carries one static archive per platform, so the
        # two macOS architectures and the two simulator architectures
        # each lipo into a single slice first. The headers ride along
        # with a module map, which is what lets SwiftPM import the
        # binary target as `CPanproto` with no system-library shim.
        run: |
          set -euxo pipefail
          cd slices
          for f in *.tar.gz; do tar -xzf "$f"; done
          ls -la

          build_xcframework() {
            local prefix="$1" out="$2" include_ios="$3"
            local work="work-$prefix"
            rm -rf "$work" "$out"
            mkdir -p "$work/headers"

            cp "$prefix-aarch64-apple-darwin/include/panproto.h" "$work/headers/"
            cp ../bindings/swift/Sources/CPanproto/include/panproto_gated.h "$work/headers/"
            cat > "$work/headers/module.modulemap" <<'MAP'
          module CPanproto {
              header "panproto.h"
              header "panproto_gated.h"
              export *
          }
          MAP

            mkdir -p "$work/macos"
            lipo -create \
              "$prefix-aarch64-apple-darwin/lib/libpanproto_c.a" \
              "$prefix-x86_64-apple-darwin/lib/libpanproto_c.a" \
              -output "$work/macos/libpanproto_c.a"

            local args=(-library "$work/macos/libpanproto_c.a" -headers "$work/headers")

            if [ "$include_ios" = "yes" ]; then
              mkdir -p "$work/ios-sim"
              lipo -create \
                "$prefix-aarch64-apple-ios-sim/lib/libpanproto_c.a" \
                "$prefix-x86_64-apple-ios/lib/libpanproto_c.a" \
                -output "$work/ios-sim/libpanproto_c.a"
              args+=(
                -library "$prefix-aarch64-apple-ios/lib/libpanproto_c.a" -headers "$work/headers"
                -library "$work/ios-sim/libpanproto_c.a" -headers "$work/headers"
              )
            fi

            xcodebuild -create-xcframework "${args[@]}" -output "$out"
            zip -qry "$out.zip" "$out"
          }

          build_xcframework panproto-c panproto_c.xcframework yes
          build_xcframework panproto-c-full panproto_c-full.xcframework no

          for f in panproto_c.xcframework.zip panproto_c-full.xcframework.zip; do
            swift package compute-checksum "$f" | tee "$f.checksum"
          done
          ls -la ./*.zip ./*.checksum
      - name: Verify the Swift package builds against the XCFramework
        run: |
          set -euxo pipefail
          cd bindings/swift
          PANPROTO_SWIFT_XCFRAMEWORK="$GITHUB_WORKSPACE/slices/panproto_c.xcframework" \
            swift build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: panproto-c-xcframework
          path: |
            slices/panproto_c.xcframework.zip
            slices/panproto_c.xcframework.zip.checksum
            slices/panproto_c-full.xcframework.zip
            slices/panproto_c-full.xcframework.zip.checksum

  sbom:
    name: Software bill of materials
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    # The dependency graph an archive was built from is a property of
    # the source, not of any one target's binary, so this is generated
    # once from the workspace rather than per matrix entry. It ships
    # beside the archives so a downstream consumer can answer "what is
    # in this" without building anything.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOM for panproto-c
        # `--locked` above and the checked-in `Cargo.lock` here are what
        # make the SBOM describe the versions actually built.
        run: |
          set -euxo pipefail
          # `--manifest-path`, not `-p`: cargo-cyclonedx takes no package
          # selector, and passing one exits 2 before doing any work.
          # Verified against cargo-cyclonedx 0.5.9.
          #
          # It writes one SBOM per workspace member, each beside its own
          # crate, so this run touches ~38 files. The repository tracks
          # those, which is why the tree is restored afterwards: a
          # release must not quietly rewrite committed SBOMs.
          cargo cyclonedx --format json --spec-version 1.5 \
            --manifest-path crates/panproto-c/Cargo.toml
          mkdir -p sbom

          # Name the file rather than searching for one. `cargo
          # cyclonedx` writes one inventory per workspace member, beside
          # that member, so a search across this workspace chooses among
          # 38 candidates and a wrong choice attests and publishes some
          # other crate's dependency graph labelled as panproto-c's. A
          # component count cannot catch that, since the wrong file is a
          # real inventory of the wrong thing; the subject check below
          # can. Right-looking and wrong is the failure this step exists
          # to prevent, so the path is exact.
          expected=crates/panproto-c/panproto-c.cdx.json
          test -f "$expected" \
            || { echo "::error::cargo-cyclonedx wrote no $expected"; exit 1; }
          cp "$expected" sbom/panproto-c.cdx.json

          # And check the SBOM says it describes panproto-c, so a file at
          # the right path holding the wrong graph still fails.
          subject=$(jq -r '.metadata.component.name // ""' sbom/panproto-c.cdx.json)
          test "$subject" = "panproto-c" \
            || { echo "::error::the SBOM describes '$subject', not panproto-c"; exit 1; }
          components=$(jq '.components | length' sbom/panproto-c.cdx.json)
          test "$components" -gt 0 \
            || { echo "::error::the SBOM lists no components"; exit 1; }
          echo "SBOM describes $subject with $components components"

          # Leave the checkout as it was found.
          git checkout -- . || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: panproto-c-sbom
          path: sbom/panproto-c.cdx.json

  release:
    name: Attach to GitHub Release
    # `sbom` is deliberately absent from `needs`: a metadata job must
    # never gate an artifact job. An inventory that fails to generate is
    # worth reporting; it is not worth withholding the binaries people
    # install, and withholding them also stalls `publish-swift.yml`,
    # which waits on the XCFramework this job attaches. The attestation
    # that consumes the inventory is guarded on the file existing
    # instead.
    needs: [build, build-ios, build-full, xcframework]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Attestation is keyless: the job's OIDC identity signs, and
      # nothing long-lived is stored. This adds no publication secret.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: panproto-c-*
          path: bindist/
          merge-multiple: true
      - name: List bindist
        run: ls -la bindist/
      - name: Checksums
        # One `SHA256SUMS` over every archive, in a format `sha256sum
        # -c` reads directly. The XCFramework already carries its own
        # `.checksum` because SwiftPM verifies that one itself; this
        # covers the tarballs and zips, which nothing verified.
        run: |
          set -euo pipefail
          cd bindist
          rm -f SHA256SUMS
          sha256sum -- * | tee SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          # Ties every archive to this workflow and this source
          # revision, so `gh attestation verify` can answer where an
          # archive came from rather than only whether it is intact.
          subject-path: |
            bindist/*.tar.gz
            bindist/*.zip
      - name: Attest the SBOM
        # Skipped when the SBOM job failed, so a missing inventory does
        # not take the archives down with it.
        if: hashFiles('bindist/panproto-c.cdx.json') != ''
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: bindist/panproto-c.cdx.json
          sbom-path: bindist/panproto-c.cdx.json
      - name: Wait for cargo-dist Release to exist, then upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        # cargo-dist's release.yml runs on the same tag push and is the
        # canonical owner of the GitHub Release object. Our prior setup
        # used `softprops/action-gh-release@v2`, which creates the
        # release if it doesn't exist; whichever workflow finished first
        # claimed creation, and the other 409d. Wait for cargo-dist's
        # creation to land, then upload our binaries into it via
        # `gh release upload --clobber` (idempotent on retry).
        #
        # The window is two hours because this job races cargo-dist by
        # construction, and the old 30-minute one was not a margin, it
        # was a near-miss. cargo-dist creates the Release only in its
        # final `announce` job, so the wait this job needs is
        # (cargo-dist's whole run) minus (this workflow's own build
        # matrix). On v0.72.1 that was 67 minutes minus 35, so it needed
        # 32 and had 30: it timed out 35 seconds before the Release
        # appeared, and `publish-swift.yml` then failed downstream
        # waiting for the XCFramework this step never attached. Both
        # halves grow with the build matrix, so the difference is not
        # stable and a tight bound re-runs this coin flip every release.
        # Two hours is roughly four times the observed requirement.
        #
        # A `gh release view` hit is enough to upload into: it matches a
        # draft too, and uploading to a draft is fine, so finding it
        # early is strictly better than waiting for publication.
        run: |
          set -euo pipefail
          attempts=720
          for i in $(seq 1 "$attempts"); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG exists; uploading bindist/*"
              gh release upload "$TAG" bindist/* --clobber
              exit 0
            fi
            if [ $((i % 30)) -eq 0 ] || [ "$i" -le 3 ]; then
              echo "Release $TAG not yet created; sleeping 10s (attempt $i/$attempts)"
            fi
            sleep 10
          done
          echo "::error::Release $TAG did not appear within 2 hours. Check whether release.yml"
          echo "::error::failed or is still running. This step is idempotent (gh release upload"
          echo "::error::--clobber), so re-run this job once the Release exists rather than retagging."
          exit 1
