name: Publish to npm

# Builds the @panproto/core TypeScript SDK (which depends on the
# panproto-wasm WASM module) and publishes to npm via Trusted
# Publishers (OIDC). No long-lived NPM_TOKEN is needed — npm is
# configured at npmjs.com/package/@panproto/core/access to trust
# this repo + workflow filename, and the npm CLI exchanges the
# job's OIDC token for short-lived publish credentials when
# `--provenance` is set.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish @panproto/core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # OIDC token for npm Trusted Publishers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Verify tag matches package version
        # On `push` (tag) the tag must match the package version. On
        # `workflow_dispatch` we trust the package version as-is — the
        # dispatch is intended for re-running a partially-failed
        # publish at the existing version.
        working-directory: bindings/typescript
        run: |
          set -euo pipefail
          pkg_version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$pkg_version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match @panproto/core version ${pkg_version}"
              exit 1
            fi
          fi

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: latest

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: publish-npm

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: bindings/typescript
        run: pnpm install --frozen-lockfile

      - name: Build (WASM + TS)
        # Must come before Test and Publish: tests under
        # tests/real-wasm.test.ts load the compiled WASM via
        # `dist/panproto_wasm.js`, and the npm publish manifest
        # ("main", "module", "types", "exports", "files") references
        # dist/. Without this step Test fails with
        # "Cannot find module @panproto/core".
        working-directory: bindings/typescript
        run: pnpm run build

      - name: Type-check
        working-directory: bindings/typescript
        run: pnpm exec tsc --noEmit

      - name: Test
        working-directory: bindings/typescript
        run: pnpm test

      - name: Fetch a recent npm into a private directory
        # npm Trusted Publishers' OIDC handshake landed in npm 11.5.1.
        # The runner image's bundled npm is older and missing the
        # promise-retry tree, so we download a fresh npm tarball
        # from the registry and invoke it via node.
        run: |
          mkdir -p "$RUNNER_TEMP/npm-bin"
          curl -fsSL https://registry.npmjs.org/npm/-/npm-11.13.0.tgz \
            | tar -xz -C "$RUNNER_TEMP/npm-bin" --strip-components=1
          node "$RUNNER_TEMP/npm-bin/bin/npm-cli.js" --version

      - name: Pack, then install the tarball into a clean fixture
        # The steps above build and test the *source tree*. What users
        # install is the tarball, and the two differ by whatever `files`
        # omits: a missing `.wasm`, a stale `dist/`, or an entry point
        # that resolves in the repo and nowhere else would all pass
        # every check above and fail on first import. So the artifact is
        # exercised, in a directory with no relative path back here.
        working-directory: bindings/typescript
        run: |
          set -euo pipefail
          NPM="node $RUNNER_TEMP/npm-bin/bin/npm-cli.js"

          # Pack into an empty directory and glob it, rather than
          # parsing the filename out of stdout. `--silent` does not
          # silence the `prepack` build, so capturing stdout captures
          # the whole tsup log with the filename on the end; and the
          # tarball lands in the working directory unless told
          # otherwise, so prefixing `$RUNNER_TEMP` to that name named
          # nothing. The directory is empty, so the glob is exact.
          packdir="$RUNNER_TEMP/pack"
          rm -rf "$packdir" && mkdir -p "$packdir"
          $NPM pack --pack-destination "$packdir"
          tarball=$(ls "$packdir"/*.tgz)
          test -f "$tarball" || { echo "::error::npm pack produced no tarball"; exit 1; }
          echo "packed $tarball ($(du -h "$tarball" | cut -f1))"

          fixture="$RUNNER_TEMP/npm-fixture"
          mkdir -p "$fixture"
          cd "$fixture"
          $NPM init -y >/dev/null
          $NPM install "$tarball"

          # A real operation against the real WASM, not just an import:
          # a package whose WASM is missing imports fine and fails here.
          cat > smoke.mjs <<'JS'
          import { Panproto } from '@panproto/core';
          const pp = await Panproto.init();
          const protocols = pp.listProtocols();
          if (!Array.isArray(protocols) || protocols.length === 0) {
            throw new Error(`expected protocols, got ${JSON.stringify(protocols)}`);
          }
          const schema = pp.parseSchemaBundle('atproto', [{
            lexicon: 1,
            id: 'com.example.smoke',
            defs: { main: { type: 'object', properties: { v: { type: 'string' } } } },
          }]);
          if (!schema.vertices['com.example.smoke']) {
            throw new Error('the packed WASM parsed nothing');
          }
          schema[Symbol.dispose]();
          console.log(`packed tarball OK: ${protocols.length} protocols`);
          JS
          node smoke.mjs

      - name: Publish
        working-directory: bindings/typescript
        run: |
          node "$RUNNER_TEMP/npm-bin/bin/npm-cli.js" \
            publish --provenance --access public
