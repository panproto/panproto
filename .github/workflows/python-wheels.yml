name: Python Wheels

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # `native` says whether this runner can execute the wheel it
          # builds, which decides whether the install check below runs.
          # It is declared here rather than derived from the target name
          # in an `if:`, so that adding a target has to answer it.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            native: false
          - os: macos-latest
            target: aarch64-apple-darwin
            native: true
          - os: macos-latest
            # The macOS runners are arm64, so this leg cross-compiles.
            target: x86_64-apple-darwin
            native: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            native: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          # The pyproject.toml lives at `bindings/python/`; it points
          # at `crates/panproto-py/Cargo.toml` via tool.maturin.manifest-path.
          # Invoking maturin with --working-directory bindings/python
          # lets `python-source = "src"` resolve to the adjacent
          # `bindings/python/src/panproto/` (with __init__.py and
          # py.typed). The previous setup had pyproject.toml inside
          # the Rust crate dir with `python-source = "../../sdk/python/src"`,
          # which maturin silently dropped (the 0.42.0 wheel contained
          # only `_native.abi3.so`).
          working-directory: bindings/python
          args: --release --out dist
          manylinux: manylinux_2_28
          before-script-linux: |
            # Package mirrors are the least reliable step in this
            # job, and the publish gate needs every one of some fifty
            # legs green, so one mirror failure in one leg withholds
            # every wheel until someone re-runs it by hand. A fetch
            # therefore retries with a backoff before it is allowed to
            # fail.
            set -eu
            retry() {
              for attempt in 1 2 3 4 5; do
                if "$@"; then return 0; fi
                echo "attempt $attempt of 5 failed: $*; retrying in $((attempt * 10))s" >&2
                sleep $((attempt * 10))
              done
              echo "still failing after 5 attempts: $*" >&2
              return 1
            }
            if command -v yum &>/dev/null; then
              retry yum install -y perl-IPC-Cmd
            elif command -v apt-get &>/dev/null; then
              retry apt-get update
              retry apt-get install -y perl
            fi
      - name: Install the built wheel and run a real operation
        # A wheel would otherwise reach PyPI without anything having
        # installed it, and source-tree tests cannot see what a wheel
        # omits: a compiled extension shipped with no `__init__.py` and
        # no `py.typed` beside it passes every check that reads the
        # source tree, then fails on a user's first import.
        #
        # Only a wheel whose target the runner can execute is testable
        # here. The cross-compiled legs are skipped rather than
        # pretended about: pip refuses a wheel whose platform tag does
        # not match the host, so an x86_64 wheel on the arm64 macOS
        # runner resolves to nothing at all.
        if: matrix.native
        shell: bash
        working-directory: bindings/python
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-check"
          # shellcheck disable=SC1091
          if [ -f "$RUNNER_TEMP/wheel-check/bin/activate" ]; then
            . "$RUNNER_TEMP/wheel-check/bin/activate"
          else
            . "$RUNNER_TEMP/wheel-check/Scripts/activate"
          fi
          # Install from the wheel alone. `--no-index` is what makes
          # this a test of the artifact rather than of PyPI.
          pip install --no-index --find-links dist panproto
          # Run from a directory with no source tree in sight, so an
          # import that only resolves next to the repo fails here.
          cd "$RUNNER_TEMP"
          python -c "
          import panproto
          print('panproto', panproto.__version__)
          protocols = panproto.list_builtin_protocols()
          assert protocols, 'the wheel exposes no protocols'
          schema = panproto.parse_schema_bundle('atproto', [{
              'lexicon': 1,
              'id': 'com.example.smoke',
              'defs': {'main': {'type': 'object', 'properties': {'v': {'type': 'string'}}}},
          }])
          assert schema.vertex_count > 0, 'the wheel parsed nothing'
          print(f'wheel OK: {len(protocols)} protocols, {schema.vertex_count} vertices')
          "

      - name: Upload wheel artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: python-wheel-*
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
