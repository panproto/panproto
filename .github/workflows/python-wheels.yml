name: Python Wheels

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          # The pyproject.toml lives at `bindings/python/`; it points
          # at `crates/panproto-py/Cargo.toml` via tool.maturin.manifest-path.
          # Invoking maturin with --working-directory bindings/python
          # lets `python-source = "src"` resolve to the adjacent
          # `bindings/python/src/panproto/` (with __init__.py and
          # py.typed). The previous setup had pyproject.toml inside
          # the Rust crate dir with `python-source = "../../sdk/python/src"`,
          # which maturin silently dropped (the 0.42.0 wheel contained
          # only `_native.abi3.so`).
          working-directory: bindings/python
          args: --release --out dist
          manylinux: manylinux_2_28
          before-script-linux: |
            if command -v yum &>/dev/null; then
              yum install -y perl-IPC-Cmd
            elif command -v apt-get &>/dev/null; then
              apt-get update && apt-get install -y perl
            fi
      - name: Upload wheel artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: python-wheel-*
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
