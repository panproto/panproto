name: Publish Swift SDK

# Runs on the same tag push as the other publish workflows. It does
# three things: pin the package to the XCFramework the bindist workflow
# just published, check the public Swift API for breakage against the
# previous tag, and publish the DocC documentation alongside the book.
#
# The engine and every binding share one version, so there is no
# Swift-specific version to bump here; the tag is the version.
#
# One-time setup this workflow needs before it can run:
#
#   * A repository `panproto/panproto-swift` to mirror into. SwiftPM
#     resolves a package URL by cloning and looking for Package.swift at
#     the root, with no subpath option, so `bindings/swift` of this
#     repository is not consumable by anyone; the mirror is what a
#     dependent actually depends on.
#   * A deploy key with write access to that repository, its private half
#     stored here as the `SWIFT_MIRROR_DEPLOY_KEY` secret.
#   * A submission to the Swift Package Index, once the mirror carries a
#     tag whose Package.swift has its release pin filled in. The index
#     reads `.spi.yml` from the mirror root and hosts DocC per release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish for
        required: true

permissions:
  contents: write

jobs:
  pin:
    name: Pin the release XCFramework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Wait for the XCFramework to be attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.value }}
        # `build-panproto-c-bindist.yml` builds and uploads it on the
        # same tag push, and its macOS and iOS matrix takes a while.
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            if gh release view "$TAG" --json assets \
                 --jq '.assets[].name' | grep -qx 'panproto_c.xcframework.zip'; then
              echo "artifact present"
              exit 0
            fi
            echo "waiting for panproto_c.xcframework.zip (attempt $i/180)"
            sleep 20
          done
          echo "::error::the XCFramework never appeared on release $TAG"
          exit 1
      - name: Refuse to move the pin backwards
        # This job checks out `main`, not the tag, so a workflow_dispatch
        # naming an older tag would rewrite main's pin backwards and push
        # it, stranding every SwiftPM consumer on a superseded
        # XCFramework. That is also the documented way to recover a
        # failed release, so the destructive path is the one an operator
        # is most likely to take. Refuse here rather than after the push.
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          python3 - "$TAG" <<'PY'
          import pathlib, re, sys

          def triple(tag):
              match = re.match(r"v?(\d+)\.(\d+)\.(\d+)", tag or "")
              return tuple(int(part) for part in match.groups()) if match else None

          tag = sys.argv[1]
          text = pathlib.Path("bindings/swift/Package.swift").read_text()
          match = re.search(
              r'^[ \t]*private let releaseXCFrameworkURL\s*=\s*"([^"]*)"',
              text,
              re.MULTILINE,
          )
          url = match.group(1) if match else ""
          current = url.rsplit("/", 2)[-2] if url else ""
          incoming, existing = triple(tag), triple(current)
          if incoming is not None and existing is not None and incoming < existing:
              sys.exit(
                  f"::error::refusing to move main's pin back from {current} to {tag}. "
                  "Re-running an older tag rewrites main's Package.swift backwards. "
                  "To republish a mirror for an older release, re-run that release's "
                  "mirror job rather than the whole workflow."
              )
          print(f"pin may move from {current or '<empty>'} to {tag}")
          PY
      - name: Rewrite the release pin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/panproto_c.xcframework.zip"
          gh release download "$TAG" --pattern panproto_c.xcframework.zip --clobber
          checksum=$(swift package --package-path bindings/swift \
                       compute-checksum panproto_c.xcframework.zip)
          rm -f panproto_c.xcframework.zip
          python3 - "$url" "$checksum" <<'PY'
          import pathlib, re, sys
          url, checksum = sys.argv[1], sys.argv[2]
          path = pathlib.Path("bindings/swift/Package.swift")
          text = path.read_text()

          # Anchored and indentation-preserving, matching the pattern the
          # mirror guard and check_version_consistency.py read with. An
          # unanchored substitution would also rewrite a mention of the
          # constant inside a comment, and a silent no-op on a renamed
          # constant would publish a release still pinned to the previous
          # XCFramework, so a miss is a hard failure.
          def pin(text, name, value):
              text, count = re.subn(
                  rf'^([ \t]*private let {name}\s*=\s*)"[^"]*"',
                  lambda m: f'{m.group(1)}"{value}"',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  sys.exit(f"::error::no {name} declaration to rewrite in {path}")
              return text

          text = pin(text, "releaseXCFrameworkURL", url)
          text = pin(text, "releaseXCFrameworkChecksum", checksum)
          path.write_text(text)
          PY
          git diff --stat bindings/swift/Package.swift
      - name: Verify a clean consumer build resolves against the pin
        # No staged library, no environment overrides: exactly what a
        # downstream package sees when it adds this one as a dependency.
        run: |
          set -euo pipefail
          rm -rf bindings/swift/.panproto-c
          cd bindings/swift && swift build
      - name: Lint the rewritten manifest
        # This job commits to main, so whatever it writes has to satisfy
        # the same gate a pull request does. Neither pinned value fits the
        # column limit beside its declaration, so both sit on continuation
        # lines and the rewrite above preserves the break by capturing it.
        # If a future rewrite collapses them back onto one line, main goes
        # red on the next push and the cause is a commit nobody made by
        # hand. Catch it here instead.
        run: cd bindings/swift && swift format lint -r --strict Package.swift
      - name: Commit the pin
        run: |
          set -euo pipefail
          if git diff --quiet bindings/swift/Package.swift; then
            echo "pin already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bindings/swift/Package.swift
          git commit -m "Pin the Swift package to the ${{ steps.tag.outputs.value }} XCFramework"
          git push origin HEAD:main

  api-diff:
    name: Swift API diff
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Build panproto-c and stage libs
        run: bash bindings/swift/bootstrap/dev-link.sh
      - name: Diff the public API against the previous tag
        # The Swift surface versions with the engine, so a source-breaking
        # change here is a breaking release even when the engine is
        # unchanged. This reports rather than blocks: whether a break is
        # intended belongs in review, not in a gate.
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -z "$previous" ]; then
            echo "::notice::no previous tag to diff against"
            exit 0
          fi
          if ! git cat-file -e "$previous:bindings/swift/Package.swift" 2>/dev/null; then
            echo "::notice::$previous predates the Swift package; nothing to diff"
            exit 0
          fi

          triple=$(swift -print-target-info \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["target"]["unversionedTriple"])')
          sdk=$(xcrun --show-sdk-path)

          dump() {
            local root="$1" out="$2"
            mkdir -p "$out"
            for product in PanprotoStructural Panproto PanprotoVcs; do
              swift build --package-path "$root/bindings/swift" --target "$product"
              xcrun swift-api-digester -dump-sdk -module "$product" \
                -o "$out/$product.json" \
                -I "$root/bindings/swift/.build/debug" \
                -sdk "$sdk" -target "$triple"
            done
          }

          dump "$PWD" /tmp/api-new
          git worktree add /tmp/previous "$previous"
          cp -R bindings/swift/.panproto-c /tmp/previous/bindings/swift/
          dump /tmp/previous /tmp/api-old

          status=0
          for product in PanprotoStructural Panproto PanprotoVcs; do
            echo "### $product"
            if ! xcrun swift-api-digester -diagnose-sdk \
                 -input-paths "/tmp/api-old/$product.json" \
                 -input-paths "/tmp/api-new/$product.json" 2>&1 | tee "/tmp/$product.diff"; then
              status=1
            fi
            if [ -s "/tmp/$product.diff" ]; then
              echo "::warning::$product changed since $previous; see the job log"
            fi
          done
          exit $status

  mirror:
    name: Mirror the package
    runs-on: ubuntu-latest
    needs: pin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve tag
        id: tag
        run: echo "value=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Assert the checked-out pin names the tag being published
        # `needs: pin` orders the two jobs but says nothing about what
        # this checkout observed: the pin job pushes to main, and this
        # job clones main again, so a checkout that lands before the
        # push propagates carries the previous release's pin. The mirror
        # is what every SwiftPM consumer resolves, so a mirror published
        # with a stale pin points all of them at the wrong XCFramework
        # for a whole release cycle. Refuse rather than publish it; the
        # fix is to re-run this job once the push has landed.
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          python3 - "$TAG" <<'PY'
          import pathlib, re, sys

          # The same pattern the rewrite step and
          # .github/scripts/check_version_consistency.py use. Reading the
          # constants three different ways meant a trailing comment or a
          # stray space failed the release here while both other readers
          # were satisfied, and the error then named a race that had not
          # happened.
          def constant(text, name):
              match = re.search(
                  rf'^[ \t]*private let {name}\s*=\s*"([^"]*)"', text, re.MULTILINE
              )
              return match.group(1) if match else ""

          tag = sys.argv[1]
          manifest = pathlib.Path("bindings/swift/Package.swift")
          text = manifest.read_text()
          url = constant(text, "releaseXCFrameworkURL")
          checksum = constant(text, "releaseXCFrameworkChecksum")
          if not url or not checksum:
              sys.exit(
                  f"::error::{manifest} carries no release pin; "
                  "the pin job's commit is not in this checkout"
              )
          pinned = url.rsplit("/", 2)[-2]
          if pinned != tag:
              sys.exit(f"::error::{manifest} pins {pinned} but this run publishes {tag}")
          print(f"pin names {tag}")
          PY
      - name: Assemble the mirror tree
        # SwiftPM resolves a package URL by cloning and looking for
        # Package.swift at the root, with no subpath option, so a package
        # living in bindings/swift of this repository is not consumable
        # by anyone. Publishing it means putting that directory at the
        # root of a repository of its own.
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mirror && mkdir -p /tmp/mirror
          rsync -a --delete \
            --exclude '.build/' \
            --exclude '.panproto-c/' \
            --exclude '.swiftpm/' \
            bindings/swift/ /tmp/mirror/

          # The index checks for a license it can detect, and the package
          # directory has none of its own.
          cp LICENSE /tmp/mirror/LICENSE

          # Every relative link in the README walks out of bindings/swift
          # and lands nowhere once the directory is a root. Rewrite them
          # to absolute URLs against the tag being published, so they
          # point at the tree they were written against rather than at
          # whatever main becomes later.
          python3 - "$TAG" <<'REWRITE'
          import pathlib, re, sys

          tag = sys.argv[1]
          base = f"https://github.com/panproto/panproto/blob/{tag}"
          readme = pathlib.Path("/tmp/mirror/README.md")
          text = readme.read_text()

          def absolute(match: "re.Match[str]") -> str:
              target = match.group(1).removeprefix("../../")
              return f"]({base}/{target})"

          text = re.sub(r"\]\((\.\./\.\./[^)]*)\)", absolute, text)
          readme.write_text(text)
          REWRITE

          if grep -rn "](\.\./" /tmp/mirror/README.md; then
            echo "::error::a relative link survived the rewrite"
            exit 1
          fi
      - name: Push to the package repository
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SWIFT_MIRROR_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --depth 1 git@github.com:panproto/panproto-swift.git /tmp/repo || {
            mkdir -p /tmp/repo && cd /tmp/repo && git init -q -b main \
              && git remote add origin git@github.com:panproto/panproto-swift.git
          }
          cd /tmp/repo
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R /tmp/mirror/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "mirror already current"
          else
            git commit -q -m "panproto Swift SDK $TAG"
          fi
          git tag -f "$TAG"
          git push origin main
          git push -f origin "$TAG"

  docs:
    name: Publish DocC
    runs-on: macos-latest
    needs: pin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - name: Build panproto-c and stage libs
        run: bash bindings/swift/bootstrap/dev-link.sh
      - name: Build DocC archives
        # The plugin is an opt-in dependency so that an ordinary build
        # never reaches the network for it, which means the one command
        # that needs it has to ask. Without this the subcommand does not
        # exist and the step fails with "Unknown subcommand or plugin
        # name".
        env:
          PANPROTO_SWIFT_DOCC: "1"
        run: |
          set -euo pipefail
          cd bindings/swift
          mkdir -p ../../docc-out
          for product in PanprotoStructural Panproto PanprotoVcs; do
            swift package --allow-writing-to-directory "../../docc-out" \
              generate-documentation --target "$product" \
              --disable-indexing \
              --transform-for-static-hosting \
              --hosting-base-path "swift/$product" \
              --output-path "../../docc-out/$product"
          done
      - name: Attach the documentation archives to the release
        # The book publishes to the external panproto/book repository
        # through a deploy key, and this repository has no gh-pages
        # branch. Rather than invent a second publishing path, the
        # archives ride with the release; hosting them under
        # panproto.dev/swift/ needs a decision about who owns the root of
        # that shared repository, which is not this workflow's to make.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd docc-out
          for product in PanprotoStructural Panproto PanprotoVcs; do
            zip -qry "panproto-docc-$product.zip" "$product"
          done
          gh release upload "$TAG" ./*.zip --clobber
