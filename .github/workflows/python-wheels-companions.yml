name: Python Wheels — Grammar Companions

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "If true, build wheels but don't publish to PyPI (artifacts uploaded only)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Each companion grammar pack ships a separate pip-installable wheel.
# They are built as their own pyo3 cdylibs depending on
# `panproto-grammars` with one `group-*` feature flag, and discovered
# at runtime by `panproto.AstParserRegistry()` through the
# `panproto.grammars` entry point. Building them in a single matrix
# keeps the per-platform wheel matrix consistent with the core
# `python-wheels.yml` workflow.

jobs:
  build:
    name: ${{ matrix.companion }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        companion:
          - functional
          - web
          - systems
          - jvm
          - scripting
          - data
          - devops
          - mobile
          - music
          - all
        # Cartesian product: 10 companions × 5 targets = 50 jobs.
        # Listing `target` as a top-level matrix axis (rather than as
        # `include` entries that don't share a key with `companion`)
        # is what makes GitHub Actions actually take the cross-product;
        # the `include:` block below then attaches the matching `os`
        # runner to each `target` value.
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      # The `grammars/` tree is committed to the repo with every
      # vendored grammar's `src/parser.c` already in place, so no
      # fetch is needed at wheel-build time. `tools/fetch-grammars.py`
      # remains the maintainer tool for refreshing vendored grammars
      # against upstream; it runs on demand, not in CI.
      - name: Build companion wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          working-directory: bindings/python-grammars-${{ matrix.companion }}
          args: --release --out dist
          manylinux: manylinux_2_28
          before-script-linux: |
            # A single archive.ubuntu.com blip used to hard-fail the
            # whole job: on v0.61.0 one aarch64 leg of ~50 could not
            # fetch perl-base, and because the publish gate needs every
            # leg green, none of the ten companion wheels published
            # until someone re-ran it by hand. Package mirrors are the
            # least reliable thing in this job, so a fetch retries
            # before it is allowed to fail.
            set -eu
            retry() {
              for attempt in 1 2 3 4 5; do
                if "$@"; then return 0; fi
                echo "attempt $attempt of 5 failed: $*; retrying in $((attempt * 10))s" >&2
                sleep $((attempt * 10))
              done
              echo "still failing after 5 attempts: $*" >&2
              return 1
            }
            if command -v yum &>/dev/null; then
              retry yum install -y perl-IPC-Cmd
            elif command -v apt-get &>/dev/null; then
              retry apt-get update
              retry apt-get install -y perl
            fi
      - name: Upload wheel artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: companion-wheel-${{ matrix.companion }}-${{ matrix.target }}
          path: bindings/python-grammars-${{ matrix.companion }}/dist/*.whl

  publish:
    name: Publish ${{ matrix.companion }} to PyPI
    needs: build
    # Skip the PyPI publish step on a manual `workflow_dispatch` when
    # `skip_publish` is true. Used to build wheels for a manual `twine
    # upload` (typical case: a tag has already published partial
    # artifacts, the matrix is now corrected, and we want all 50
    # wheels in hand for an out-of-band upload that claims the
    # PyPI package names).
    if: github.event_name != 'workflow_dispatch' || inputs.skip_publish != true
    strategy:
      fail-fast: false
      matrix:
        companion:
          - functional
          - web
          - systems
          - jvm
          - scripting
          - data
          - devops
          - mobile
          - music
          - all
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: companion-wheel-${{ matrix.companion }}-*
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
