name: Python Wheels — Grammar Companions

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Each companion grammar pack ships a separate pip-installable wheel.
# They are built as their own pyo3 cdylibs depending on
# `panproto-grammars` with one `group-*` feature flag, and discovered
# at runtime by `panproto.AstParserRegistry()` through the
# `panproto.grammars` entry point. Building them in a single matrix
# keeps the per-platform wheel matrix consistent with the core
# `python-wheels.yml` workflow.

jobs:
  build:
    name: ${{ matrix.companion }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        companion:
          - functional
          - web
          - systems
          - jvm
          - scripting
          - data
          - devops
          - mobile
          - music
          - all
        include:
          # Each platform listed once, joined with the companion list
          # via `target` below. This mirrors python-wheels.yml's set.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install tree-sitter CLI
        # `tree-sitter generate` is needed for the audio-language
        # grammars we author from source (`tidal-mini`, `strudel-mini`)
        # whose `src/parser.c` we don't currently check in to the
        # audio-programming-language-grammars repo at every commit;
        # `tools/fetch-grammars.py` falls back to running the CLI
        # when `parser.c` is missing.
        if: matrix.companion == 'music' || matrix.companion == 'all'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.companion == 'music' || matrix.companion == 'all'
        run: cargo install --locked tree-sitter-cli
      - name: Fetch grammar sources
        # Each companion's pyo3 cdylib only compiles in the grammars
        # selected by its `group-*` feature flag. The `panproto-grammars`
        # build.rs walks `grammars/<lang>/src/`; if those directories
        # don't exist, the produced cdylib has no grammars. Fetching
        # at CI time keeps the workspace small.
        run: python3 tools/fetch-grammars.py
      - name: Build companion wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: bindings/python-grammars-${{ matrix.companion }}
          args: --release --out dist
          manylinux: manylinux_2_28
          before-script-linux: |
            if command -v yum &>/dev/null; then
              yum install -y perl-IPC-Cmd
            elif command -v apt-get &>/dev/null; then
              apt-get update && apt-get install -y perl
            fi
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: companion-wheel-${{ matrix.companion }}-${{ matrix.target }}
          path: bindings/python-grammars-${{ matrix.companion }}/dist/*.whl

  publish:
    name: Publish ${{ matrix.companion }} to PyPI
    needs: build
    strategy:
      fail-fast: false
      matrix:
        companion:
          - functional
          - web
          - systems
          - jvm
          - scripting
          - data
          - devops
          - mobile
          - music
          - all
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: companion-wheel-${{ matrix.companion }}-*
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
