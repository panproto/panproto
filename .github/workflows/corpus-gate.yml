name: Corpus Gate

# The gates that take too long for a change: the `corpus`, `exhaustive` and
# `kan` tiers of `.config/verification.toml`. The first two run nightly, the
# third weekly, and all three on the commit of a release, where publishing
# requires them (`require-verified.yml`).
#
#   * The full emit corpus gates round-trip every vendored grammar's entire
#     upstream test/corpus under the strict oracle, and take ~30 minutes.
#   * The span solver's oracle agreement sweep enumerates every assignment of
#     both networks of every enumerable lexicon pair and checks the solver's
#     answer against the true optimum. ~160 seconds unoptimised.
#   * The cross-process corpus span comparison searches every ordered corpus
#     pair in sixteen separate processes and compares the whole span, so a
#     result that varied with the hash seed would show up as a second digest.
#     ~7 minutes unoptimised.
on:
  schedule:
    - cron: "0 6 * * *"
    # Weekly: the Kan agreement, which needs 65 jobs.
    - cron: "0 12 * * 6"
  workflow_dispatch:
    inputs:
      release:
        description: Verify a release commit (every tier, about four hours)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      exhaustive: ${{ steps.plan.outputs.exhaustive }}
      kan: ${{ steps.plan.outputs.kan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: plan
        run: |
          set -euo pipefail
          for tier in exhaustive kan; do
            echo "$tier=$(python3 .github/scripts/verification.py gates $tier)" >> "$GITHUB_OUTPUT"
          done

  corpus-gate:
    name: Whole-corpus gates
    if: github.event.schedule != '0 12 * * 6'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: corpus-gate
      - uses: taiki-e/install-action@b5c73bb82f2ad2b0f63804f6a057b567a4f54a2d # nextest
      - name: Run the full-corpus emit gates
        run: |
          cargo nextest run -p panproto-parse --all-features \
            -E 'test(/corpus_verified_protocols_round_trip_full_corpus|strip_complement_canonical_section_is_structurally_faithful|long_tail_emit_is_verified/)'
      # Unoptimised on purpose: the debug build keeps `debug_assert!` live, and
      # the solver states several of its internal invariants that way.
      - name: Run the corpus oracle agreement sweep
        run: |
          cargo nextest run -p panproto-mig --features oracle \
            -E 'test(every_enumerable_lexicon_pair_agrees_with_exhaustive_enumeration)'
      # Sixteen child processes each rerun the whole corpus, so this needs the
      # unoptimised build the step above already warmed.
      - name: Run the cross-process corpus span comparison
        run: |
          cargo nextest run -p panproto-mig \
            -E 'test(every_corpus_pair_yields_the_same_span_in_every_process)'

  exhaustive:
    name: Exhaustive reference agreement (${{ matrix.name }})
    needs: plan
    if: github.event.schedule != '0 12 * * 6'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.exhaustive) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: exhaustive-reference-${{ matrix.package }}
      - uses: taiki-e/install-action@b5c73bb82f2ad2b0f63804f6a057b567a4f54a2d # nextest
      # The default nextest profile has no per-test bound, and the `ci-test`
      # cargo profile keeps debug assertions and overflow checks live.
      - name: Run the gate
        env:
          PACKAGE: ${{ matrix.package }}
          BINARY: ${{ matrix.binary }}
          EXPRESSION: ${{ matrix.expression }}
          SHARD: ${{ matrix.shard }}
          SHARD_ENV: ${{ matrix.shard_env }}
        run: |
          if [ -n "$SHARD" ]; then
            export "$SHARD_ENV=$SHARD"
          fi
          cargo nextest run --locked --cargo-profile ci-test --no-tests=fail \
            -p "$PACKAGE" --test "$BINARY" -E "$EXPRESSION"

  kan:
    name: Exhaustive Kan agreement (${{ matrix.name }})
    needs: plan
    if: github.event.schedule == '0 12 * * 6' || inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.kan) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: exhaustive-kan-${{ matrix.package }}
      - uses: taiki-e/install-action@b5c73bb82f2ad2b0f63804f6a057b567a4f54a2d # nextest
      # The default nextest profile has no per-test bound, and the `ci-test`
      # cargo profile keeps debug assertions and overflow checks live.
      - name: Run the gate
        env:
          PACKAGE: ${{ matrix.package }}
          BINARY: ${{ matrix.binary }}
          EXPRESSION: ${{ matrix.expression }}
          SHARD: ${{ matrix.shard }}
          SHARD_ENV: ${{ matrix.shard_env }}
          PANPROTO_KAN_THREADS: "4"
        run: |
          if [ -n "$SHARD" ]; then
            export "$SHARD_ENV=$SHARD"
          fi
          cargo nextest run --locked --cargo-profile ci-test --no-tests=fail \
            -p "$PACKAGE" --test "$BINARY" -E "$EXPRESSION"

  release:
    # The check `require-verified.yml` looks for on a release commit.
    name: Release verification
    needs: [corpus-gate, exhaustive, kan]
    if: always() && inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every gate to have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'to_entries | map(select(.value.result != "success")) | length == 0'
