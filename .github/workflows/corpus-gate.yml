name: Corpus Gate

# The whole-corpus gates run here rather than on every PR, because each of them
# walks a committed corpus end to end and is too slow for per-PR CI (see the
# `ci` nextest profile in `.config/nextest.toml`): nightly, and on demand.
#
#   * The full emit corpus gates round-trip every vendored grammar's entire
#     upstream test/corpus under the strict oracle, and take ~30 minutes.
#   * The span solver's oracle agreement sweep enumerates every assignment of
#     both networks of every enumerable lexicon pair and checks the solver's
#     answer against the true optimum. ~160 seconds unoptimised.
#   * The cross-process corpus span comparison searches every ordered corpus
#     pair in sixteen separate processes and compares the whole span, so a
#     result that varied with the hash seed would show up as a second digest.
#     ~7 minutes unoptimised.
#
# The `exhaustive-reference` job runs the exhaustive reference agreements that
# exceed the ordinary per-test bound even in the optimised `ci-test` build (see
# `.config/nextest.toml`). Dispatch this workflow before tagging a release.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-gate:
    name: Whole-corpus gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: corpus-gate
      - uses: taiki-e/install-action@b5c73bb82f2ad2b0f63804f6a057b567a4f54a2d # nextest
      - name: Run the full-corpus emit gates
        run: |
          cargo nextest run -p panproto-parse --all-features \
            -E 'test(/corpus_verified_protocols_round_trip_full_corpus|strip_complement_canonical_section_is_structurally_faithful|long_tail_emit_is_verified/)'
      # Unoptimised on purpose: the debug build keeps `debug_assert!` live, and
      # the solver states several of its internal invariants that way.
      - name: Run the corpus oracle agreement sweep
        run: |
          cargo nextest run -p panproto-mig --features oracle \
            -E 'test(every_enumerable_lexicon_pair_agrees_with_exhaustive_enumeration)'
      # Sixteen child processes each rerun the whole corpus, so this needs the
      # unoptimised build the step above already warmed.
      - name: Run the cross-process corpus span comparison
        run: |
          cargo nextest run -p panproto-mig \
            -E 'test(every_corpus_pair_yields_the_same_span_in_every_process)'

  exhaustive-reference:
    name: Exhaustive reference agreement (${{ matrix.test }})
    runs-on: ubuntu-latest
    # Each agreement runs in a job of its own. Run together on one runner they
    # shared four cores, and the bounded lens law sweep was still running when
    # the job reached the runner's six-hour maximum. A job per test gives each
    # one the whole runner and its own six hours, and one failure no longer
    # cancels the others.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: panproto-gat
            binary: reference_theories
            test: composition_agrees_with_the_reference_on_every_discrete_pair
          - package: panproto-inst
            binary: reference_coercion
            test: nearest_reading_coercion_agrees_with_the_reference
          - package: panproto-inst
            binary: reference_coercion
            test: coerce_value_agrees_with_the_reference_over_the_values_scope
          - package: panproto-lens
            binary: reference_lenses
            test: lens_laws_agree_with_the_reference_exhaustively
          - package: panproto-lens
            binary: reference_lenses
            test: lens_path_law_certificate
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: exhaustive-reference-${{ matrix.package }}
      - uses: taiki-e/install-action@b5c73bb82f2ad2b0f63804f6a057b567a4f54a2d # nextest
      # The default nextest profile has no per-test bound, and the `ci-test`
      # cargo profile keeps debug assertions and overflow checks live.
      - name: Run the exhaustive reference agreement
        env:
          PACKAGE: ${{ matrix.package }}
          BINARY: ${{ matrix.binary }}
          TEST: ${{ matrix.test }}
        run: |
          cargo nextest run --locked --cargo-profile ci-test --no-tests=fail \
            -p "$PACKAGE" --test "$BINARY" -E "test(=$TEST)"
