name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  versions:
    name: Version Consistency
    runs-on: ubuntu-latest
    # Fast-fail guard: assert every version-declaring file in the
    # workspace pins the same version as `Cargo.toml`'s
    # `[workspace.package]`. Catches the silent-PyPI-stranding shape
    # of bug where a literal version field rots independently of the
    # workspace bump and `skip-existing: true` masks the failure.
    steps:
      - uses: actions/checkout@v6
        with:
          # The Swift release pin is allowed to lag the workspace, and
          # the tag list is what separates a legitimate lag from a pin
          # job that failed on an intervening release. A default
          # checkout fetches no tags, which leaves that distinction
          # unmakeable; the check reports which record it had in its
          # summary line rather than failing, so this is what keeps the
          # coverage real instead of quietly degraded.
          fetch-tags: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # The check's own rules, exercised against a table of release
      # states. It touches no files, so it runs as a flag on the script
      # rather than as a harness with a dependency to install.
      - run: python3 .github/scripts/check_version_consistency.py --self-test --verbose
      - run: python3 .github/scripts/check_version_consistency.py --verbose

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Compile the fuzz targets
        # `fuzz/` is its own workspace, so neither the clippy job above nor
        # the test job below reaches it. Without this the fuzz targets can
        # stop compiling against the crates they drive and nothing says so.
        run: cargo check --manifest-path fuzz/Cargo.toml

  test:
    name: Tests (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.85.0"]
    steps:
      - name: Free disk space
        run: |
          # The matrix-multiplied test job compiles 250 tree-sitter
          # grammars; without trimming, the GitHub-hosted Ubuntu
          # runner's 14 GB disk fills before tests complete.
          # Removes Android SDK, .NET, Haskell, large preinstalled
          # tools (~30 GB freed) before any cargo step runs.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - uses: taiki-e/install-action@nextest
      # The `ci` nextest profile skips the two multi-minute full-corpus emit
      # gates; they run in the scheduled `corpus-gate` workflow (and locally by
      # default). See `.config/nextest.toml`.
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --doc --workspace

  feature-check:
    name: Feature Combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check --feature-powerset --no-dev-deps -p panproto-core -p panproto-io -p panproto-wasm

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack
      - run: wasm-pack build crates/panproto-wasm --target web --dev

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  book-doctest:
    name: Book Doctests
    runs-on: ubuntu-latest
    # Compiles every ```rust block in book/src/**/*.md and rejects `rust,ignore`
    # against the workspace, surfacing API drift as soon as it lands
    # rather than when a reader copies a stale snippet. Driver:
    # xtask/src/bin/test-book.rs.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask --bin test-book

  deny:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  ts:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-pack
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: cd bindings/typescript && pnpm install --no-frozen-lockfile
      - run: cd bindings/typescript && pnpm run build
      - run: cd bindings/typescript && pnpm test
      - run: cd bindings/typescript && pnpm exec tsc --noEmit
      # Smoke-test that Panproto.init() works in pure Node.js (regression
      # guard for GitHub issue #33: WASM not included / fetch file:// fails).
      - run: cd bindings/typescript && node --input-type=module -e "import('./dist/index.js').then(async ({ Panproto }) => { const p = await Panproto.init(); console.log('Panproto.init() OK in Node ' + process.version); })"

  python:
    name: Python SDK (Native)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.os }}
      - run: python -m venv .venv && . .venv/bin/activate && pip install maturin pytest
      - run: . .venv/bin/activate && cd bindings/python && maturin develop
      - run: . .venv/bin/activate && python -c "import panproto; print(f'panproto {panproto.__version__} loaded, {len(panproto.list_builtin_protocols())} protocols')"
      - run: . .venv/bin/activate && cd bindings/python && python -m pytest tests/ -x

  python-companion:
    # Smoke-test that a companion grammar pack registers grammars into
    # the wrapper's AstParserRegistry via the `panproto.grammars` entry
    # point. Uses `panproto-grammars-functional` as the canary; the
    # other 8 companions follow the same architecture (and the same
    # generator template), so a failure of any of them would surface
    # as a functional-pack failure here. The on-tag publish workflow
    # (`python-wheels-companions.yml`) builds all nine.
    name: Python Companion Grammar Pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-companion-${{ matrix.os }}
      - run: python -m venv .venv && . .venv/bin/activate && pip install maturin
      # Build & install the core wheel first; the companion's runtime
      # dep on `panproto>=0.45,<0.46` is satisfied by this editable
      # install, and the entry-point discovery only fires when the
      # core panproto is importable.
      - run: . .venv/bin/activate && cd bindings/python && maturin develop --release
      # Build the functional pack to validate cross-cdylib registration.
      # Other packs follow the same template (generated from the same
      # script); a green functional run validates the architecture for
      # the rest. The music pack is an exception — its grammars are
      # fetched at CI time via `tools/fetch-grammars.py`, not vendored.
      - run: . .venv/bin/activate && cd bindings/python-grammars-functional && maturin develop --release
      - run: |
          . .venv/bin/activate
          python - <<'PY'
          import warnings
          warnings.simplefilter("always")
          import panproto

          reg = panproto.AstParserRegistry()
          protos = set(reg.protocol_names())

          # Built-in core gives ~10; functional adds ~10 more (erlang
          # is skipped upstream because of a malformed node-types.json).
          assert len(protos) >= 18, f"expected ≥18 protocols, got {len(protos)}: {sorted(protos)}"
          for lang in ("haskell", "ocaml", "scheme", "clojure"):
              assert lang in protos, f"{lang} not registered (have: {sorted(protos)})"

          # End-to-end parse to confirm the registered grammar is
          # actually wired through the FFI boundary correctly.
          schema = reg.parse_with_protocol("haskell", b"f x = x", "main.hs")
          assert schema.vertex_count > 0, "haskell parse produced empty schema"

          # Native registry (no companion) still produces only built-ins.
          native = panproto._native.AstParserRegistry()
          assert len(native.protocol_names()) < len(protos)

          print(f"OK: {len(protos)} protocols with companion ({len(native.protocol_names())} core)")
          PY

  haskell:
    name: Haskell SDK
    runs-on: ubuntu-latest
    # The only CI job that exercises the panproto-c C ABI across a real
    # C-linkage boundary: `bootstrap/dev-link.sh` builds panproto-c and
    # the hand-written C glue from source, then the cabal package is
    # built and tested against the FFI backend. This covers the by-value
    # safer-ffi structs, the `*_at` glue wrappers, the `VecU8`
    # marshalling, and the cross-language CBOR wire agreement that the
    # Rust-side `panproto-c` tests cannot reach. The default build links
    # the FFI backend (`+rust`); `native-only` covers the pure-Haskell
    # backend. The feature-gated cold-path surfaces (parse/project/git)
    # need the full tree-sitter grammar build and are exercised at
    # release time, not per PR.
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: haskell
      - uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.16.0.0"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: haskell-cabal-${{ hashFiles('bindings/haskell/panproto.cabal') }}
          restore-keys: haskell-cabal-
      - name: Build panproto-c + C glue, stage libs
        run: bash bindings/haskell/bootstrap/dev-link.sh
      - name: cabal update
        run: cd bindings/haskell && cabal update
      - name: Build and test (FFI backend, +rust)
        # panproto-c builds a cdylib alongside the staticlib, so GHC
        # links libpanproto_c dynamically; point the runtime loader at
        # the staged lib dir so the test binary resolves it.
        run: cd bindings/haskell && cabal test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/bindings/haskell/.panproto-c/lib
      - name: Build and test (native-only)
        run: cd bindings/haskell && cabal test -f native-only

  swift:
    name: Swift SDK
    runs-on: macos-latest
    # The second consumer of the panproto-c C ABI, and the one that
    # exercises it from a strict-concurrency host: every engine call is
    # routed through a global actor pinned to one thread, because the
    # last-error slot is thread-local (the slab is process-global and
    # mutex-guarded, so it is not what needs pinning). Alongside the
    # tests this job runs the gates the other bindings learned to want:
    # the generated header must match what the package compiles
    # against, every ABI entry point must have a Swift shim, every
    # public method must be named by a test, every listing a tutorial
    # step shows must type-check, and every documentation catalog must
    # build with no unresolved link in it.
    defaults:
      run:
        working-directory: bindings/swift
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: swift
      - name: Header drift gate
        working-directory: .
        # Regenerating must be a no-op, and the vendored copy the Swift
        # package compiles against must be byte-identical to it. A
        # silent ABI change is the failure mode this catches: the shims
        # would still compile and would call the wrong thing.
        run: |
          PP_REGEN_HEADERS=1 cargo test -p panproto-c --features headers -- generate_headers
          git diff --exit-code crates/panproto-c/include/panproto.h
          diff -u crates/panproto-c/include/panproto.h \
                  bindings/swift/Sources/CPanproto/include/panproto.h
      - name: Build panproto-c and stage libs
        working-directory: .
        run: bash bindings/swift/bootstrap/dev-link.sh
      - name: Lint
        run: swift format lint -r --strict Sources Tests Examples Scripts Package.swift
      - name: Build
        run: swift build --build-tests
      - name: Build with every trait enabled
        # The gated sources compile to nothing without their trait, so
        # nothing else in this job type-checks them.
        #
        # Only the library targets are built. Linking an executable
        # needs a libpanproto_c carrying the gated symbols, which this
        # job does not stage, and a library target stops at compilation,
        # so this checks exactly what it can: that the gated sources
        # still type-check.
        run: |
          swift build --traits PANPROTO_PARSE --target PanprotoParse
          swift build --traits PANPROTO_PROJECT --target PanprotoProject
          swift build --traits PANPROTO_GIT --target PanprotoGit
      - name: Test
        run: swift test
      - name: Parity gate
        run: python3 Scripts/parity-gate.py
      - name: Tutorial gate
        # A tutorial's listings sit inside a documentation catalog,
        # which SwiftPM copies rather than compiles, so nothing else in
        # this job would notice one that stopped building.
        run: python3 Scripts/tutorial-gate.py
      - name: Documentation gate
        # Every symbol link has to resolve. A link into another module
        # cannot, since a target's documentation build sees only its own
        # symbols, so those are written as code spans instead.
        env:
          PANPROTO_SWIFT_DOCC: "1"
        run: |
          swift package generate-documentation \
            --target PanprotoStructural --warnings-as-errors
          swift package generate-documentation \
            --target Panproto --warnings-as-errors
          swift package generate-documentation \
            --target PanprotoVcs --warnings-as-errors

  semver:
    name: Semver Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # panproto-jit and panproto-llvm pull in llvm-sys through inkwell
      # behind optional features; cargo-semver-checks runs rustdoc for every
      # member and the runner doesn't set LLVM_SYS_*_PREFIX for that nested
      # invocation. They're thin FFI wrappers, not public-API-promise crates
      # for SDK consumers, so we exclude them from semver checking.
      #
      # `panproto-c` and `panproto-dsl-eval` are excluded until their
      # first publish lands on crates.io: cargo-semver-checks needs a
      # baseline version to diff against, and a never-published crate
      # has none.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          exclude: panproto-jit,panproto-llvm,panproto-c,panproto-dsl-eval
