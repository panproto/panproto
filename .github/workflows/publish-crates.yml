name: Publish to crates.io

# Triggers on version tags. Publishes the workspace crates in
# topological order using crates.io Trusted Publishing (OIDC).
# Configured per crate at https://crates.io/crates/<name>/settings
# under "Trusted Publishing" with:
#   Repository: panproto/panproto
#   Workflow:   publish-crates.yml
# `rust-lang/crates-io-auth-action` exchanges the job's OIDC token
# for a short-lived registry token, exposed as CARGO_REGISTRY_TOKEN
# for the duration of the publish step.
#
# The publish loop is idempotent: if a crate at this version is
# already on crates.io (e.g. a previous run published some crates
# before failing), the loop swallows the "already published" error
# via `cargo search` and continues with the next crate.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC token for crates.io Trusted Publishing

jobs:
  publish:
    name: Publish workspace crates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-crates

      - name: Resolve workspace version
        id: version
        # On tag push (e.g. `v0.40.0`) the tag must match the workspace
        # version. On `workflow_dispatch` we trust the workspace version
        # as-is — the dispatch is intended for re-running a partially-
        # failed publish at the existing version.
        run: |
          set -euo pipefail
          ws_version=$(grep -A 1 '^\[workspace.package\]' Cargo.toml \
            | grep '^version' \
            | head -1 \
            | cut -d'"' -f2)
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$ws_version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match workspace version ${ws_version}"
              exit 1
            fi
          fi
          echo "version=$ws_version" >> "$GITHUB_OUTPUT"

      - name: Authenticate to crates.io via Trusted Publishing
        # Exchanges the workflow's OIDC token for a short-lived
        # crates.io registry token and exports it as
        # CARGO_REGISTRY_TOKEN for subsequent `cargo publish` calls.
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth

      - name: Publish in topological order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # Topological order. Each level's crates may depend only on
          # earlier levels. cargo publish waits for the index to update
          # before returning, so no explicit sleep is needed.
          # `--locked` pins to Cargo.lock; `--no-verify` skips the
          # local rebuild verification step (we trust CI which already
          # built and tested the workspace at this commit).
          publish_one() {
            local crate="$1"
            echo "::group::publish $crate"
            local out
            if out=$(cargo publish -p "$crate" --locked --no-verify 2>&1); then
              echo "$out"
              echo "$crate $VERSION published"
            else
              local code=$?
              echo "$out"
              # Idempotent re-runs: cargo publish prints
              # "crate <name>@<version> already exists on crates.io index"
              # when the exact version is already on the registry. Match
              # that message directly rather than running a separate
              # `cargo search` (whose output format is unreliable in CI).
              if echo "$out" | grep -q "already exists on crates.io index"; then
                echo "$crate $VERSION already published; continuing"
              else
                echo "::error::cargo publish $crate failed with code $code"
                return $code
              fi
            fi
            echo "::endgroup::"
          }

          # Level 0
          publish_one panproto-expr
          publish_one panproto-grammars
          # Level 1
          publish_one panproto-expr-parser
          publish_one panproto-gat
          # Level 2
          publish_one panproto-schema
          # Level 3
          publish_one panproto-inst
          # Level 4
          publish_one panproto-mig
          publish_one panproto-protocols
          # Level 5
          publish_one panproto-lens
          # Level 6
          publish_one panproto-parse
          # panproto-dsl-eval owns the shared Nickel/YAML/JSON evaluator and
          # has no internal deps; publish it before panproto-lens-dsl and
          # panproto-theory-dsl, which both depend on it.
          publish_one panproto-dsl-eval
          publish_one panproto-lens-dsl
          publish_one panproto-check
          publish_one panproto-theory-dsl
          publish_one panproto-jit
          publish_one panproto-llvm
          # Level 7 — depends on parse, protocols, schema
          publish_one panproto-io
          # Level 8 — depends on schema, mig, check, lens, gat, inst,
          # expr, protocols
          publish_one panproto-vcs
          # Level 9 — depend on vcs (xrpc, project)
          publish_one panproto-xrpc
          publish_one panproto-project
          # Level 10 — depends on project + vcs
          publish_one panproto-git
          # Level 11 — facade; has optional `git` feature that pulls
          # in panproto-git, so core must publish AFTER git
          publish_one panproto-core
          # Level 12 — depend on core (wasm, cli) and on git/xrpc/vcs
          # (git-remote)
          publish_one panproto-wasm
          # panproto-cli depends on panproto-repl (the `schema theory
          # repl` subcommand drives the panproto-repl library). Publish
          # the dependency first or cargo refuses with "failed to
          # select a version for the requirement panproto-repl".
          publish_one panproto-repl
          publish_one panproto-cli
          publish_one panproto-git-remote
