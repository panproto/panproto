name: Publish to crates.io

# Triggers on version tags. Publishes the workspace crates in
# topological order using crates.io Trusted Publishing (OIDC).
# Configured per crate at https://crates.io/crates/<name>/settings
# under "Trusted Publishing" with:
#   Repository: panproto/panproto
#   Workflow:   publish-crates.yml
# `rust-lang/crates-io-auth-action` exchanges the job's OIDC token
# for a short-lived registry token, exposed as CARGO_REGISTRY_TOKEN
# for the duration of the publish step.
#
# The publish loop is idempotent: if a crate at this version is
# already on crates.io (e.g. a previous run published some crates
# before failing), the loop swallows the "already published" error
# via `cargo search` and continues with the next crate.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC token for crates.io Trusted Publishing

jobs:
  publish:
    name: Publish workspace crates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: publish-crates

      - name: Resolve workspace version
        id: version
        # On tag push (e.g. `v0.40.0`) the tag must match the workspace
        # version. On `workflow_dispatch` we trust the workspace version
        # as-is — the dispatch is intended for re-running a partially-
        # failed publish at the existing version.
        run: |
          set -euo pipefail
          ws_version=$(grep -A 1 '^\[workspace.package\]' Cargo.toml \
            | grep '^version' \
            | head -1 \
            | cut -d'"' -f2)
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$ws_version" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match workspace version ${ws_version}"
              exit 1
            fi
          fi
          echo "version=$ws_version" >> "$GITHUB_OUTPUT"

      - name: Authenticate to crates.io via Trusted Publishing
        # Exchanges the workflow's OIDC token for a short-lived
        # crates.io registry token and exports it as
        # CARGO_REGISTRY_TOKEN for subsequent `cargo publish` calls.
        uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth

      - name: Publish in topological order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          # Topological order. Each level's crates may depend only on
          # earlier levels. cargo publish waits for the index to update
          # before returning, so no explicit sleep is needed.
          # `--locked` pins to Cargo.lock; `--no-verify` skips the
          # local rebuild verification step (we trust CI which already
          # built and tested the workspace at this commit).
          publish_one() {
            local crate="$1"
            echo "::group::publish $crate"
            local out
            if out=$(cargo publish -p "$crate" --locked --no-verify 2>&1); then
              echo "$out"
              echo "$crate $VERSION published"
            else
              local code=$?
              echo "$out"
              # Idempotent re-runs: cargo publish prints
              # "crate <name>@<version> already exists on crates.io index"
              # when the exact version is already on the registry. Match
              # that message directly rather than running a separate
              # `cargo search` (whose output format is unreliable in CI).
              if echo "$out" | grep -q "already exists on crates.io index"; then
                echo "$crate $VERSION already published; continuing"
              elif echo "$out" | grep -q "do not support creating new crates"; then
                # A crate that has never been published cannot be created by a
                # Trusted Publishing (OIDC) token; crates.io requires an owner
                # to `cargo publish` it once with an API token, then enable
                # Trusted Publishing for it. Flag it and continue rather than
                # failing the whole release; a new crate that other crates
                # depend on will still surface downstream as its dependents
                # fail to resolve it.
                echo "::warning::$crate is new on crates.io and cannot be created via Trusted Publishing. Publish it once manually (cargo publish -p $crate) and add Trusted Publishing (Repo panproto/panproto, Workflow publish-crates.yml), then re-run this workflow."
                NEW_CRATES+=("$crate")
              else
                echo "::error::cargo publish $crate failed with code $code"
                return $code
              fi
            fi
            echo "::endgroup::"
          }

          # Publishable workspace members, in topological order, derived from
          # `cargo metadata` so this list can never drift from the workspace:
          # adding or removing a crate needs no edit here (a stale entry for a
          # removed crate would fail with "did not match any packages"; a
          # missing entry for a new crate would fail its dependents). Normal,
          # build, AND dev dependencies gate ordering: `cargo publish` must
          # resolve a crate's dev-dependencies too, so a workspace crate used
          # as a dev-dependency must be published before its dependent (e.g.
          # panproto-check dev-depends on panproto-protocols). `publish = false`
          # crates are excluded.
          CRATES=()
          while IFS= read -r crate_name; do
            [ -n "$crate_name" ] && CRATES+=("$crate_name")
          done < <(python3 -c '
          import json, subprocess
          meta = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--format-version", "1", "--no-deps"]))
          pkgs = {p["name"]: p for p in meta["packages"]}
          pub = {}
          for n, p in pkgs.items():
              reg = p.get("publish")
              if reg is None or "crates-io" in reg:
                  pub[n] = p
          names = set(pub)
          edges = {}
          for n, p in pub.items():
              deps = []
              for d in p["dependencies"]:
                  if d["name"] in names and d.get("kind") in (None, "build", "dev"):
                      deps.append(d["name"])
              edges[n] = sorted(set(deps))
          order, seen, stack = [], set(), set()
          def visit(n):
              if n in seen or n in stack:
                  return
              stack.add(n)
              for d in edges[n]:
                  visit(d)
              stack.discard(n)
              seen.add(n)
              order.append(n)
          for n in sorted(pub):
              visit(n)
          print("\n".join(order))
          ')
          if [ "${#CRATES[@]}" -eq 0 ]; then
            echo "::error::no publishable crates derived from cargo metadata"
            exit 1
          fi
          NEW_CRATES=()
          echo "Publishing ${#CRATES[@]} crates in topological order:"
          printf '  %s\n' "${CRATES[@]}"
          for crate in "${CRATES[@]}"; do
            publish_one "$crate"
          done
          if [ "${#NEW_CRATES[@]}" -gt 0 ]; then
            echo "::warning::New crates were skipped (each needs a manual first publish + Trusted Publishing before the next release): ${NEW_CRATES[*]}"
          fi
