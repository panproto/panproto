# What CI verifies, and where each part of it runs.
#
# This file is the one declaration. `.github/scripts/verification.py` derives
# the job matrices of the workflows from it, and checks that the tests the
# `ci` profile of `.config/nextest.toml` leaves out of the ordinary suite are
# exactly the gates below, so no test can be in neither.
#
# A bucket is a set of packages whose ordinary tests run on one machine. The
# packages no bucket lists form one more, so a new package is tested without
# being added here. `features` are those a build of the whole workspace turns
# on and a build of the bucket alone would not.

[[bucket]]
name = "lens"
packages = ["panproto-lens", "panproto-lens-dsl"]

[[bucket]]
name = "inst"
packages = ["panproto-inst"]

[[bucket]]
name = "theory"
packages = [
    "panproto-expr",
    "panproto-expr-parser",
    "panproto-gat",
    "panproto-gat-macros",
    "panproto-reference",
    "panproto-schema",
    "panproto-theory-dsl",
]

[[bucket]]
name = "migration"
packages = ["panproto-check", "panproto-mig", "panproto-protocols", "panproto-vcs", "panproto-xrpc"]
features = ["panproto-mig/oracle"]

[[bucket]]
name = "git"
packages = ["panproto-git", "panproto-git-remote", "panproto-project"]

# Gates run outside the ordinary suite. A certificate runs on a change that
# affects its package: one that touches the package, a package it depends on,
# or a file that belongs to no package. An exhaustive or Kan gate takes hours,
# and runs on a schedule and on the commit of a release. A gate with several
# `tests` runs them in one job; `shards` runs a test as that many jobs, each
# given `i/shards` in `shard_env`.

[[gate]]
tier = "certificate"
name = "graph put domain"
package = "panproto-lens"
binary = "reference_lenses"
tests = [
    "graph_put_domain_and_cascade_law_certificate",
    "randomized_graph_put_domain_and_cascade_differential",
    "randomized_graph_put_law_differential",
]

[[gate]]
tier = "certificate"
name = "lens equivalence"
package = "panproto-lens"
binary = "reference_lenses"
tests = [
    "lens_equivalence_law_certificate",
    "randomized_lens_law_differential",
    "table_get_put_law_certificate",
    "tree_put_law_certificate",
]

[[gate]]
tier = "certificate"
name = "graph put and protolenses"
package = "panproto-lens"
binary = "reference_lenses"
tests = [
    "graph_put_law_certificate",
    "protolens_schema_law_certificate",
    "protolens_transforms_agree_with_the_reference_exhaustively",
    "randomized_protolens_instance_differential",
    "randomized_protolens_schema_differential",
]

[[gate]]
tier = "certificate"
name = "theory composition"
package = "panproto-gat"
binary = "reference_theories"
tests = [
    "composition_agrees_on_every_class_signature_pair",
    "composition_agrees_with_the_reference_on_every_span",
]

[[gate]]
