# cargo-nextest configuration.
#
# The `ci` profile is used by the per-PR `Tests` job in
# `.github/workflows/ci.yml`. It skips the whole-corpus gates, which are the
# tests that walk an entire committed corpus rather than a fixture:
#
#   * the three full-corpus emit gates, which round-trip every vendored
#     grammar's entire upstream `test/corpus/` and take ~30 minutes combined,
#     and
#   * the span solver's oracle agreement sweep, which enumerates every
#     assignment of both networks of every enumerable lexicon pair and takes
#     ~160 seconds unoptimised, past the 60 second slow threshold below.
#
# Running these on every PR is wasteful: the code they exercise is stable, and
# they still run
#
#   * by default for local runs (`cargo nextest run`), and
#   * on a schedule (and on demand) in the `corpus-gate` workflow,
#
# so both guarantees stay enforced without blocking PR CI.
[profile.ci]
default-filter = 'not test(/corpus_verified_protocols_round_trip_full_corpus|strip_complement_canonical_section_is_structurally_faithful|long_tail_emit_is_verified|every_enumerable_lexicon_pair_agrees_with_exhaustive_enumeration/)'

# Kill a test that runs away instead of letting it hold the suite open.
#
# Nothing here previously bounded a test's runtime, so a change that made
# an operation quadratic showed up as repeated SLOW lines and a run that
# never finished, rather than as a failure. An unbounded test reads as slow
# rather than broken, which is the wrong signal.
#
# The bound applies to the `ci` profile, whose slowest observed test is
# around four minutes; the whole-corpus gates are excluded from this profile
# by `default-filter` above and so are unaffected.
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "5s" }
