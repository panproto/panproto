# cargo-nextest configuration.
#
# The `ci` profile runs the ordinary tests. It leaves out exactly the gates of
# `.config/verification.toml`, which run in jobs of their own: the certificates
# on a change that affects their package, the rest on a schedule and on the
# commit of a release. `.github/scripts/verification.py write` writes the filter
# from that file and CI checks that the two agree, so no test is in neither.
#
# The filter names package, binary and test, since a test name alone would also
# leave out tests of the same name elsewhere. Every test runs by default for
# local runs (`cargo nextest run`).
#
# CI builds this profile's tests under the `ci-test` cargo profile of the
# workspace `Cargo.toml` (`--cargo-profile ci-test`): `dev` with optimisation,
# so debug assertions and overflow checks stay live. The bounds below are set
# against that build.
[profile.ci]
# Report every failing test in one run rather than stopping at the first.
fail-fast = false
default-filter = 'not ((package(=panproto-lens) & binary(=reference_lenses) & (test(=graph_put_domain_and_cascade_law_certificate) | test(=randomized_graph_put_domain_and_cascade_differential) | test(=randomized_graph_put_law_differential))) | (package(=panproto-lens) & binary(=reference_lenses) & (test(=lens_equivalence_law_certificate) | test(=randomized_lens_law_differential) | test(=table_get_put_law_certificate) | test(=tree_put_law_certificate))) | (package(=panproto-lens) & binary(=reference_lenses) & (test(=graph_put_law_certificate) | test(=protolens_schema_law_certificate) | test(=protolens_transforms_agree_with_the_reference_exhaustively) | test(=randomized_protolens_instance_differential) | test(=randomized_protolens_schema_differential))) | (package(=panproto-gat) & binary(=reference_theories) & (test(=composition_agrees_on_every_class_signature_pair) | test(=composition_agrees_with_the_reference_on_every_span))) | (package(=panproto-inst) & binary(=reference_kan) & (test(=bounded_family_kan_objects_agree_with_the_reference) | test(=every_labelled_object_has_the_reference_units_and_counits) | test(=graph_decoding_agrees_with_the_reference_on_every_table_and_layout) | test(=graph_encoding_graph_adjunctions_agree_with_the_reference) | test(=randomized_kan_hom_bijection_differential) | test(=representative_pair_shards_match_unsharded_prefix))) | (package(=panproto-reference) & binary(=edits) & (test(=every_accepted_perturbation_of_a_short_lowering_is_an_image_of_its_reading) | test(=lowerings_read_back_soundly_with_every_floor_near_the_id_ceiling) | test(=the_u32_tree_edit_semantics_refines_the_unbounded_one_near_the_id_ceiling))) | (package(=panproto-reference) & binary(=kan) & (test(=complete_bounded_family_has_typed_kan_results_and_refusals))) | (package(=panproto-parse) & binary(=emit_corpus_audit) & (test(=corpus_verified_protocols_round_trip_full_corpus) | test(=strip_complement_canonical_section_is_structurally_faithful))) | (package(=panproto-parse) & binary(=emit_long_tail) & (test(=long_tail_emit_is_verified))) | (package(=panproto-mig) & binary(=lexicon_oracle) & (test(=every_enumerable_lexicon_pair_agrees_with_exhaustive_enumeration))) | (package(=panproto-mig) & binary(=the_corpus_span_is_a_function_of_the_pair) & (test(=every_corpus_pair_yields_the_same_span_in_every_process))) | (package(=panproto-gat) & binary(=reference_theories) & (test(=composition_agrees_with_the_reference_on_every_discrete_pair))) | (package(=panproto-inst) & binary(=reference_coercion) & (test(=nearest_reading_coercion_agrees_with_the_reference))) | (package(=panproto-inst) & binary(=reference_coercion) & (test(=coerce_value_agrees_with_the_reference_over_the_values_scope))) | (package(=panproto-lens) & binary(=reference_lenses) & (test(=lens_laws_agree_with_the_reference_exhaustively))) | (package(=panproto-lens) & binary(=reference_lenses) & (test(=lens_path_law_certificate))) | (package(=panproto-inst) & binary(=reference_edits) & (test(=graph_edit_algebra_matches_reference_on_every_word_of_the_coverage_scope))) | (package(=panproto-inst) & binary(=reference_edits) & (test(=table_edits_match_reference_on_every_word_of_the_coverage_scope))) | (package(=panproto-inst) & binary(=reference_edits) & (test(=tree_edits_and_lowering_match_reference_on_every_word_of_the_coverage_scope))) | (package(=panproto-inst) & binary(=reference_edits) & (test(=graph_independence_and_merge_match_reference_on_every_letter_pair_of_the_coverage_scope))) | (package(=panproto-reference) & binary(=kan) & (test(=exhaustive_kan_executes_every_representative_profile_pair))) | (package(=panproto-reference) & binary(=kan) & (test(=exhaustive_kan_every_labelled_member_has_checked_operation_transports))) | (package(=panproto-inst) & binary(=reference_kan) & (test(=exhaustive_kan_hom_profile_pairs_agree_with_the_reference))))'

# Kill a test that runs away instead of letting it hold the suite open.
#
# Without a bound on a test's runtime, a change that made an operation
# quadratic would show up as repeated SLOW lines and a run that never
# finished, rather than as a failure. An unbounded test reads as slow
# rather than broken, which is the wrong signal.
#
# The bound applies to the `ci` profile. Under the `ci-test` build the
# slowest of its ordinary tests measured alone on a developer machine is
# under four and a half minutes, and GitHub's runners have measured up to
# about three times slower; the few tests near that edge have their own
# longer bound below. The gates are excluded from this profile by
# `default-filter` above and so are unaffected.
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "5s" }

# The scaling tests of panproto-inst (every test named `*_not_charged_per_*`)
# compare a workload's time at two sizes. Their measure is built to resist
# machine load: each round times one large run against a window of repeated
# small runs of the same length taken right after it, and the verdict is the
# median of that quotient over the rounds
# (`crates/panproto-inst/tests/common/mod.rs`). Running each of them while no
# other test of the run holds a thread removes the load the suite itself
# adds, and `max-threads = 1` keeps two of them from overlapping.
[test-groups]
scaling = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(panproto-inst) & test(/_not_charged_per_/)'
test-group = 'scaling'
threads-required = 'num-cpus'

# The throughput tests of the integration suite (`performance`) time a
# fixed number of lifts against a records-per-second floor. A lift validates
# its input and its output under their protocols, which is most of its cost
# in an unoptimised build, where the measured rate sits within a factor of
# two of the floor and the suite's own parallel load is enough to push it
# under. They run the way the scaling tests do: one at a time, with no other
# test of the run holding a thread.
[[profile.default.overrides]]
filter = 'package(panproto-integration-tests) & binary(performance)'
test-group = 'scaling'
threads-required = 'num-cpus'

# The table-lens agreement sweep of `panproto-lens/tests/law_reference.rs`
# checks the production law gate against the reference gate on every one of
# its 9,921 source and lens cases. It is CPU-bound on one thread: measured
# alone in a debug build, 762 s of user time over 783 s of wall time, so it
# cannot finish inside the ten-minute bound above whatever the load, and
# inside full parallel runs it was observed at 813 s and 1,359 s. It gets a
# thirty-minute bound of its own.
[[profile.ci.overrides]]
filter = 'package(panproto-lens) & binary(law_reference) & test(=check_laws_agrees_with_the_gate_evaluator_on_small_table_lenses)'
slow-timeout = { period = "60s", terminate-after = 30, grace-period = "5s" }
threads-required = 'num-cpus'

# The `miri` profile runs the tests of the pure-Rust core under Miri, which
# is about a hundred times slower than a native run. It leaves out the tests
# that walk a whole bounded scope or compare against the reference model on
# thousands of inputs, each of which took over twenty minutes under Miri and
# several over six hours, and the tests that start other processes, which
# Miri cannot run. Every one of them runs natively in the `ci` profile or as
# a gate, and Miri runs every other test of the three crates. Any other test
# that runs past twenty minutes under Miri fails instead of holding its
# partition open.
[profile.miri]
fail-fast = false
# A Miri process of one test can hold several gigabytes; with one per core
# a partition starved its runner of memory and the runner was lost.
test-threads = 2
default-filter = 'not ((package(=panproto-expr) & binary(=reference_values) & (test(=reference_nan_identities_cover_all_widths_and_production_matches_reduced_widths) | test(=binary16_operations_agree_with_the_reference) | test(=closest_shortest_printers_agree_with_the_reference) | test(=evaluation_agrees_with_the_reference) | test(=decimal_orders_agree_with_the_reference) | test(=exact_float_reading_corresponds_on_decoded_binary64_rationals) | test(=binary_rounding_agrees_with_the_reference) | test(=randomized_temporal_to_epoch_count_round_trip) | test(=a_leap_second_precedes_the_next_minute))) | (package(=panproto-expr) & binary(=epoch_counts) & (test(=an_epoch_count_round_trips))) | (package(=panproto-expr) & binary(=exact_values) & (test(=exact::fractions_order_as_decimal_fractions_on_the_stated_scope) | test(=exact::shortest_float_decimals_match_an_independent_oracle_on_a_bounded_scope) | test(=exact::chronological_order_agrees_with_an_oracle_on_a_bounded_scope) | test(=exact::wide_integer_arithmetic_agrees_with_i128_on_a_bounded_scope))) | (package(=panproto-expr) & binary(=exact_values_pinned) & (test(=days_since_epoch_are_inverted_on_the_reference_day_number))) | (package(=panproto-expr) & binary(=reduced_temporals) & (test(=sql_temporal_forms) | test(=temporal_lexemes_agree_with_the_reference) | test(=unwritten_offsets_and_infinities_remain_distinct))) | (package(=panproto-expr) & binary(=zero_offsets) & (test(=every_offset_round_trips_through_its_written_form))) | (package(=panproto-gat) & binary(=reference_theories) & (test(=composition_agrees_with_the_reference_on_every_span) | test(=signature_checking_agrees_with_the_reference_on_every_signature) | test(=equation_preservation_agrees_with_the_reference_on_every_equation_pair) | test(=composition_agrees_on_every_class_signature_pair) | test(=quotient_closure_agrees_with_the_reference_on_every_identification_list) | test(=morphism_checking_agrees_with_the_reference_on_every_assignment) | test(=recipe_replay_agrees_with_the_reference_on_every_recipe) | test(=composition_agrees_with_the_reference_on_every_discrete_pair) | test(=randomized_theory_differential))) | (package(=panproto-gat) & binary(=panproto_gat) & (test(=morphism::tests::a_side_whose_normalization_spends_the_budget_is_undecided))) | (package(=panproto-schema) & binary(=reference_keys) & (test(=canonical_declaration_factorization_reconciles_the_exact_carrier))) | (package(=panproto-gat) & binary(=panproto_gat) & test(=morphism::tests::theory_morphism_bytes_are_identical_across_processes)) | (package(=panproto-schema) & binary(=a_serialized_schema_is_the_same_in_every_process)))'
slow-timeout = { period = "300s", terminate-after = 4, grace-period = "10s" }
