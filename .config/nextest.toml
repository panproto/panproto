# cargo-nextest configuration.
#
# The `ci` profile is used by the per-PR `Tests` job in
# `.github/workflows/ci.yml`. It skips the whole-corpus gates, which are the
# tests that walk an entire committed corpus rather than a fixture:
#
#   * the three full-corpus emit gates, which round-trip every vendored
#     grammar's entire upstream `test/corpus/` and take ~30 minutes combined,
#     and
#   * the span solver's oracle agreement sweep, which enumerates every
#     assignment of both networks of every enumerable lexicon pair and takes
#     ~160 seconds unoptimised, past the 60 second slow threshold below, and
#   * the cross-process corpus span comparison, which runs the whole corpus in
#     sixteen separate processes to show the span does not depend on the hash
#     seed and takes ~7 minutes unoptimised. Its two fixture-sized siblings,
#     `the_span_is_a_function_of_the_pair` and
#     `span_is_the_same_in_every_process`, run on every PR in under two seconds
#     and are what would catch a regression; the corpus run is the wider net.
#     Its name is unique on purpose, since the filter below matches test names
#     across every binary and the fixture siblings must stay lit.
#   * the exhaustive Kan acceptance tests, which enumerate the complete labelled
#     member and representative-pair spaces. They are acceptance gates with
#     separately persisted evidence; the representative-pair certificate alone
#     takes several hours in release mode and cannot fit an ordinary CI job.
#   * the edit algebra's coverage-scope differentials, which walk every word
#     of at most three edits from every graph, table and tree of the scope
#     (about 1.3 billion words) and compare production with the reference
#     after each letter. They run in release mode as acceptance gates; the
#     fixed-alphabet edit differentials beside them stay in the profile.
#   * the five exhaustive reference agreements that exceed the ten-minute
#     bound below even in the optimised `ci-test` build, measured alone on a
#     developer machine with three test threads:
#     `composition_agrees_with_the_reference_on_every_discrete_pair` (every
#     discrete two-node diagram over the full signature scope, 61.5 million
#     compositions), `nearest_reading_coercion_agrees_with_the_reference` and
#     `coerce_value_agrees_with_the_reference_over_the_values_scope` (the whole
#     values scope), and `lens_laws_agree_with_the_reference_exhaustively` and
#     `lens_path_law_certificate` (the bounded lens carrier and every path
#     over it). Each passed 600 s without finishing. Beside them runs
#     `graph_edit_lens_law_certificate`, which translates every one-letter
#     get and put edit of every base of the bounded lens graph carrier
#     through the graph edit lens and the reference, and is sharded like the
#     lens law sweep; its two-node slice stays in this profile. Beside it runs
#     `segmented_graph_put_agrees_with_the_reference_and_assembles_to_whole_state_put`,
#     which puts every edit of the segmented view of every 97th case of the
#     segmented restriction carrier back segment by segment (114 s
#     unoptimised), sharded four ways; its every-eighth-case slice stays in
#     this profile. Beside it runs
#     `segmented_graph_put_run_matches_the_reference_runner_at_every_cancellation_point`,
#     which puts the same views back as checkpointed runs from every
#     cancellation point against the reference runner (296 s per shard
#     unoptimised), sharded four ways; its every-64th-case slice stays in
#     this profile. Beside it runs
#     `segmented_apply_agrees_with_the_reference_on_every_case_of_the_carrier`,
#     which applies every delta of the segmented graph edit carrier to every
#     family of it (958,740 cases, about 240 s unoptimised), sharded two
#     ways; its every-97th-case slice stays in this profile. Beside it runs
#     `segmented_table_edit_lens_agrees_with_the_reference_and_the_whole_state_lens_on_every_case`,
#     which translates every source letter and puts back every view letter
#     of every case of the segmented table put carrier (91,170 letters,
#     108 s in the `ci-test` build), sharded four ways; its every-eighth-case
#     slice stays in this profile. They run in the
#     `exhaustive-reference` job of the `corpus-gate` workflow, nightly and on
#     demand; dispatch it before tagging a release. That job splits
#     `lens_laws_agree_with_the_reference_exhaustively` into twelve shards
#     through `PANPROTO_TEST_SHARD=i/n`; unset, the test compares every case.
#   * the migration search's refusal-scope differential,
#     `a_bounded_search_answers_or_names_its_bound_on_every_bounded_pair`
#     (1,524,096 budgeted searches), which took 72 s alone in the `ci-test`
#     build on a developer machine, past the 60 second slow threshold below.
#     The same job runs it as four shards through `PANPROTO_TEST_SHARD`, and
#     its sixteenth-sized sibling
#     `bounded_searches_on_one_sixteenth_of_the_refusal_scope_answer_or_name_their_bound`
#     stays in this profile.
#
# Running these on every PR is wasteful. Every excluded test still runs by
# default for local runs (`cargo nextest run`). The corpus gates also run
#
#   * by default for local runs (`cargo nextest run`), except for the oracle
#     agreement sweep, which requires `-p panproto-mig --features oracle`, and
#   * on a schedule (and on demand) in the `corpus-gate` workflow,
#
# The exhaustive Kan certificates instead run as separately recorded
# acceptance gates. Thus both guarantees stay enforced without blocking PR CI.
#
# CI builds this profile's tests under the `ci-test` cargo profile of the
# workspace `Cargo.toml` (`--cargo-profile ci-test`): `dev` with optimisation,
# so debug assertions and overflow checks stay live. The bounds below are set
# against that build.
[profile.ci]
# Report every failing test in one run rather than stopping at the first.
fail-fast = false
default-filter = 'not test(/corpus_verified_protocols_round_trip_full_corpus|strip_complement_canonical_section_is_structurally_faithful|long_tail_emit_is_verified|every_enumerable_lexicon_pair_agrees_with_exhaustive_enumeration|every_corpus_pair_yields_the_same_span_in_every_process|exhaustive_kan_executes_every_representative_profile_pair|exhaustive_kan_every_labelled_member_has_checked_operation_transports|exhaustive_kan_hom_profile_pairs_agree_with_the_reference|graph_edit_algebra_matches_reference_on_every_word_of_the_coverage_scope|graph_independence_and_merge_match_reference_on_every_letter_pair_of_the_coverage_scope|graph_rebase_keeps_independent_deltas_and_agrees_with_the_merge_on_the_rebase_scope|table_rebase_keeps_independent_deltas_and_agrees_with_the_merge_on_the_rebase_scope|table_edits_match_reference_on_every_word_of_the_coverage_scope|tree_edits_and_lowering_match_reference_on_every_word_of_the_coverage_scope|composition_agrees_with_the_reference_on_every_discrete_pair|nearest_reading_coercion_agrees_with_the_reference|coerce_value_agrees_with_the_reference_over_the_values_scope|lens_laws_agree_with_the_reference_exhaustively|lens_path_law_certificate|graph_edit_lens_law_certificate|segmented_graph_put_agrees_with_the_reference_and_assembles_to_whole_state_put|segmented_graph_put_run_matches_the_reference_runner_at_every_cancellation_point|segmented_apply_agrees_with_the_reference_on_every_case_of_the_carrier|segmented_table_edit_lens_agrees_with_the_reference_and_the_whole_state_lens_on_every_case|a_bounded_search_answers_or_names_its_bound_on_every_bounded_pair/)'

# Kill a test that runs away instead of letting it hold the suite open.
#
# Without a bound on a test's runtime, a change that made an operation
# quadratic would show up as repeated SLOW lines and a run that never
# finished, rather than as a failure. An unbounded test reads as slow
# rather than broken, which is the wrong signal.
#
# The bound applies to the `ci` profile. Under the `ci-test` build the
# slowest of its ordinary tests measured alone on a developer machine is
# under four and a half minutes, and GitHub's runners have measured up to
# about three times slower; the few tests near that edge have their own
# longer bound below. The whole-corpus and exhaustive gates are excluded
# from this profile by `default-filter` above and so are unaffected.
slow-timeout = { period = "60s", terminate-after = 10, grace-period = "5s" }

# The scaling tests of panproto-inst (every test named `*_not_charged_per_*`)
# compare a workload's time at two sizes. Their measure is built to resist
# machine load: each round times one large run against a window of repeated
# small runs of the same length taken right after it, and the verdict is the
# median of that quotient over the rounds
# (`crates/panproto-inst/tests/common/mod.rs`). Running each of them while no
# other test of the run holds a thread removes the load the suite itself
# adds, and `max-threads = 1` keeps two of them from overlapping.
[test-groups]
scaling = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(panproto-inst) & test(/_not_charged_per_/)'
test-group = 'scaling'
threads-required = 'num-cpus'

# The throughput tests of the integration suite (`performance`) time a
# fixed number of lifts against a records-per-second floor. A lift validates
# its input and its output under their protocols, which is most of its cost
# in an unoptimised build, where the measured rate sits within a factor of
# two of the floor and the suite's own parallel load is enough to push it
# under. They run the way the scaling tests do: one at a time, with no other
# test of the run holding a thread.
[[profile.default.overrides]]
filter = 'package(panproto-integration-tests) & binary(performance)'
test-group = 'scaling'
threads-required = 'num-cpus'

# The table-lens agreement sweep of `panproto-lens/tests/law_reference.rs`
# checks the production law gate against the reference gate on every one of
# its 9,921 source and lens cases. It is CPU-bound on one thread: measured
# alone in a debug build, 762 s of user time over 783 s of wall time, so it
# cannot finish inside the ten-minute bound above whatever the load, and
# inside full parallel runs it was observed at 813 s and 1,359 s. It gets a
# thirty-minute bound of its own.
[[profile.ci.overrides]]
filter = 'package(panproto-lens) & binary(law_reference) & test(=check_laws_agrees_with_the_gate_evaluator_on_small_table_lenses)'
slow-timeout = { period = "60s", terminate-after = 30, grace-period = "5s" }
threads-required = 'num-cpus'

# The theory class-comparison acceptance gate streams 2,815^2 operation
# pairs and 260^2 sort pairs through both public composition engines. The
# carrier is small, but the 7,991,825 comparisons cannot fit the ordinary
# ten-minute CI timeout. Run it alone, allow two hours, and keep it in the
# ordinary CI filter; its own worker pool is capped at four.
[[profile.ci.overrides]]
filter = 'package(panproto-gat) & binary(reference_theories) & test(=composition_agrees_on_every_class_signature_pair)'
slow-timeout = { period = "60s", terminate-after = 120, grace-period = "5s" }
threads-required = 'num-cpus'

# The lens law certificates over the bounded graph carrier fit the ten-minute
# bound in the `ci-test` build but not by the margin a slow runner needs:
# measured alone on a developer machine, `graph_put_law_certificate` took
# 179 s and `lens_equivalence_law_certificate` 266 s, and the graph put-domain
# certificate and its randomized differential first search the whole carrier
# for a witness of every refusal family, which took 364 s. GitHub's runners
# have measured up to about three times slower than that machine. They get a
# thirty-minute bound of their own.
[[profile.ci.overrides]]
filter = 'package(panproto-lens) & binary(reference_lenses) & (test(=graph_put_law_certificate) | test(=lens_equivalence_law_certificate) | test(=graph_put_domain_and_cascade_law_certificate) | test(=randomized_graph_put_domain_and_cascade_differential))'
slow-timeout = { period = "60s", terminate-after = 30, grace-period = "5s" }

# The reference differentials and law certificates below finish inside the
# ten-minute bound when they run beside light tests: on the hosted runners
# each took between 250 s and 515 s. Beside the heavy certificates above they
# slow by up to a factor of two, and `randomized_kan_hom_bijection_differential`
# (350 s to 367 s) and
# `protolens_transforms_agree_with_the_reference_exhaustively` (298 s to
# 515 s) each once exceeded 600 s. They get the thirty-minute bound too.
[[profile.ci.overrides]]
filter = '(package(panproto-inst) & binary(reference_kan) & (test(=bounded_family_kan_objects_agree_with_the_reference) | test(=randomized_kan_hom_bijection_differential))) | (package(panproto-lens) & binary(reference_lenses) & (test(=protolens_transforms_agree_with_the_reference_exhaustively) | test(=protolens_schema_law_certificate) | test(=randomized_graph_put_law_differential) | test(=randomized_lens_law_differential) | test(=randomized_protolens_instance_differential) | test(=table_get_put_law_certificate) | test(=tree_put_law_certificate)))'
slow-timeout = { period = "60s", terminate-after = 30, grace-period = "5s" }
