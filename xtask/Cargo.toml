[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Repository tasks for panproto. Not published."

[[bin]]
name = "gen-cli-docs"
path = "src/bin/gen-cli-docs.rs"

[[bin]]
name = "test-book"
path = "src/bin/test-book.rs"

[[bin]]
name = "gen-grammar-packs"
path = "src/bin/gen-grammar-packs.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
