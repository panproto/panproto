[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "panproto-grammars-devops"
dynamic = ["version"]
description = "panproto grammar pack: DevOps — Dockerfile, Terraform, HCL, Nix, Bash, YAML, TOML, Make, CMake"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Aaron Steven White", email = "aaronstevenwhite@gmail.com" },
]
keywords = ["panproto", "tree-sitter", "grammar", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]
dependencies = [
    "panproto>=0.58,<0.59",
]

[project.entry-points."panproto.grammars"]
devops = "panproto_grammars_devops._impl"

[project.urls]
Homepage = "https://github.com/panproto/panproto"
Issues = "https://github.com/panproto/panproto/issues"

[tool.maturin]
manifest-path = "../../crates/panproto-grammars-devops/Cargo.toml"
python-source = "src"
module-name = "panproto_grammars_devops._impl"
features = ["pyo3/extension-module"]
