<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img" aria-label="A Lexicon document becomes a schema, the schema carries a migration that compiles, and the compiled migration lifts a parsed post record back out as JSON.">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#69A9F0"/>
    </marker>
  </defs>
  <rect x="40" y="46" width="200" height="76" rx="10"
        fill="#1F1F22" stroke="#48484A" stroke-width="1.5"/>
  <text x="140" y="78" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#F5F5F7">app.bsky.feed.post.json</text>
  <text x="140" y="100" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">Lexicon document</text>
  <rect x="280" y="46" width="200" height="76" rx="10"
        fill="#1B2A3D" stroke="#3E6B9E" stroke-width="1.5"/>
  <text x="380" y="78" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#F5F5F7">SchemaHandle</text>
  <text x="380" y="100" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">39 vertices, 39 edges</text>
  <rect x="520" y="46" width="200" height="76" rx="10"
        fill="#1F1F22" stroke="#48484A" stroke-width="1.5"/>
  <text x="620" y="78" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#F5F5F7">Migration</text>
  <text x="620" y="100" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">identity, checked</text>
  <rect x="760" y="46" width="200" height="76" rx="10"
        fill="#1B2A3D" stroke="#3E6B9E" stroke-width="1.5"/>
  <text x="860" y="78" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#F5F5F7">CompiledMigrationHandle</text>
  <text x="860" y="100" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">surviving verts and edges</text>
  <rect x="40" y="250" width="200" height="76" rx="10"
        fill="#1F1F22" stroke="#48484A" stroke-width="1.5"/>
  <text x="140" y="282" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#F5F5F7">post-0.json</text>
  <text x="140" y="304" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">281 bytes in</text>
  <rect x="280" y="250" width="200" height="76" rx="10"
        fill="#1F1F22" stroke="#48484A" stroke-width="1.5"/>
  <text x="380" y="282" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#F5F5F7">Instance</text>
  <text x="380" y="304" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">5 nodes, 4 arcs</text>
  <rect x="520" y="250" width="200" height="76" rx="10"
        fill="#1F1F22" stroke="#48484A" stroke-width="1.5"/>
  <text x="620" y="282" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#F5F5F7">Instance</text>
  <text x="620" y="304" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">lifted</text>
  <rect x="760" y="250" width="200" height="76" rx="10"
        fill="#1F1F22" stroke="#48484A" stroke-width="1.5"/>
  <text x="860" y="282" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#F5F5F7">post-0.json</text>
  <text x="860" y="304" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">256 bytes out</text>
