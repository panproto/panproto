  <line x1="486" y1="84" x2="514" y2="84" stroke="#69A9F0" stroke-width="2" marker-end="url(#head)"/>
  <line x1="726" y1="84" x2="754" y2="84" stroke="#69A9F0" stroke-width="2" marker-end="url(#head)"/>
  <line x1="246" y1="288" x2="274" y2="288" stroke="#69A9F0" stroke-width="2" marker-end="url(#head)"/>
  <line x1="486" y1="288" x2="514" y2="288" stroke="#69A9F0" stroke-width="2" marker-end="url(#head)"/>
  <line x1="726" y1="288" x2="754" y2="288" stroke="#69A9F0" stroke-width="2" marker-end="url(#head)"/>
  <text x="240" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">parse</text>
  <text x="480" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">identity</text>
  <text x="720" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">compile</text>
  <text x="240" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">parse</text>
  <text x="480" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">lift</text>
  <text x="720" y="276" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">emit</text>
  <line x1="860" y1="128" x2="480" y2="242" stroke="#69A9F0" stroke-width="2" marker-end="url(#head)"/>
  <text x="690" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#A1A1A6">drives the lift</text>
</svg>
