[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "panproto-grammars-data"
dynamic = ["version"]
description = "panproto grammar pack: Data — JSON, TOML, XML, YAML, SQL, CSV, GraphQL, Protobuf"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Aaron Steven White", email = "aaronstevenwhite@gmail.com" },
]
keywords = ["panproto", "tree-sitter", "grammar", "data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]
dependencies = [
    "panproto>=0.66,<0.67",
]

[project.entry-points."panproto.grammars"]
data = "panproto_grammars_data._impl"

[project.urls]
Homepage = "https://github.com/panproto/panproto"
Issues = "https://github.com/panproto/panproto/issues"

[tool.maturin]
manifest-path = "../../crates/panproto-grammars-data/Cargo.toml"
python-source = "src"
module-name = "panproto_grammars_data._impl"
features = ["pyo3/extension-module"]
