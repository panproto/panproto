[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "panproto"
# The version is dynamic: maturin reads it from
# `crates/panproto-py/Cargo.toml`, which inherits the workspace version,
# so the wheel and the workspace cannot disagree.
dynamic = ["version"]
description = "Schematic version control for 51 schema languages and 262 programming languages"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Aaron Steven White", email = "aaronstevenwhite@gmail.com" },
]
keywords = ["schema", "migration", "gat", "lens", "category-theory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://panproto.dev"
Documentation = "https://panproto.dev/book/"
Repository = "https://github.com/panproto/panproto"
Issues = "https://github.com/panproto/panproto/issues"
Changelog = "https://github.com/panproto/panproto/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyright>=1.1",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
]

[tool.maturin]
# This pyproject.toml lives at `bindings/python/`; the Rust crate is
# at `crates/panproto-py/`. Point maturin at the Cargo manifest, and
# at the python source directory adjacent to this file.
#
# The previous layout had pyproject.toml inside `crates/panproto-py/`
# with `python-source = "../../sdk/python/src"`. Maturin silently
# dropped the `../../` python source from the wheel (the published
# 0.42.0 wheel contained only `_native.abi3.so` — no `__init__.py`,
# no `py.typed`). Maturin's `python-source` resolution does not
# tolerate paths that traverse out of the project root; relocating
# pyproject.toml so the source is `src/` (a direct child) is the
# canonical fix.
manifest-path = "../../crates/panproto-py/Cargo.toml"
python-source = "src"
module-name = "panproto._native"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py313"
line-length = 99
# The prose docs align the trailing comments in their examples into a column,
# which reads better than the formatter's single space and is not code the
# formatter has any other claim on.
extend-exclude = ["docs", "README.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A stub declares the parameter names the extension actually uses, and
# `tests/test_stub_parity.py` fails if it declares any others. `Schema.vertex`
# takes `id` and `IoRegistry.parse` takes `format` because `pyo3` says so, so
# the builtin-shadowing rule has nothing here it could ask for.
"src/panproto/_native.pyi" = ["A002"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
