[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "panproto-grammars-functional"
dynamic = ["version"]
description = "panproto grammar pack: functional languages (Haskell, OCaml, Elm, Gleam, Erlang, Elixir, PureScript, F#, Clojure, Scheme, Racket)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Aaron Steven White", email = "aaronstevenwhite@gmail.com" },
]
keywords = ["panproto", "tree-sitter", "grammar", "haskell", "ocaml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]
dependencies = [
    # The wrapper class in `panproto/__init__.py` discovers this
    # companion via the entry point declared below; without panproto
    # installed there is no consumer for the grammars this package
    # ships.
    "panproto>=0.68,<0.69",
]

[project.entry-points."panproto.grammars"]
# panproto.AstParserRegistry()'s constructor walks every entry point
# under "panproto.grammars" and calls each loaded module's
# `grammars_metadata()`. The pyo3 module that actually owns the
# baked-in grammar bytes is `panproto_grammars_functional._impl`.
functional = "panproto_grammars_functional._impl"

[project.urls]
Homepage = "https://github.com/panproto/panproto"
Issues = "https://github.com/panproto/panproto/issues"

[tool.maturin]
manifest-path = "../../crates/panproto-grammars-functional/Cargo.toml"
python-source = "src"
module-name = "panproto_grammars_functional._impl"
features = ["pyo3/extension-module"]
