[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "panproto-grammars-music"
dynamic = ["version"]
description = "panproto grammar pack: Music — SuperCollider, LilyPond, ABC, Csound, ChucK, Glicol, Tidal mini-notation, Strudel mini-notation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Aaron Steven White", email = "aaronstevenwhite@gmail.com" },
]
keywords = ["panproto", "tree-sitter", "grammar", "music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]
dependencies = [
    "panproto>=0.62,<0.63",
]

[project.entry-points."panproto.grammars"]
music = "panproto_grammars_music._impl"

[project.urls]
Homepage = "https://github.com/panproto/panproto"
Issues = "https://github.com/panproto/panproto/issues"

[tool.maturin]
manifest-path = "../../crates/panproto-grammars-music/Cargo.toml"
python-source = "src"
module-name = "panproto_grammars_music._impl"
features = ["pyo3/extension-module"]
