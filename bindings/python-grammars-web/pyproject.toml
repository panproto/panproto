[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "panproto-grammars-web"
dynamic = ["version"]
description = "panproto grammar pack: Web — HTML, CSS, JavaScript, TypeScript, TSX, JSON, Vue, Svelte, Astro, GraphQL"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Aaron Steven White", email = "aaronstevenwhite@gmail.com" },
]
keywords = ["panproto", "tree-sitter", "grammar", "web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]
dependencies = [
    "panproto>=0.52,<0.53",
]

[project.entry-points."panproto.grammars"]
web = "panproto_grammars_web._impl"

[project.urls]
Homepage = "https://github.com/panproto/panproto"
Issues = "https://github.com/panproto/panproto/issues"

[tool.maturin]
manifest-path = "../../crates/panproto-grammars-web/Cargo.toml"
python-source = "src"
module-name = "panproto_grammars_web._impl"
features = ["pyo3/extension-module"]
