[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "panproto-grammars-systems"
dynamic = ["version"]
description = "panproto grammar pack: Systems — C, C++, Rust, Go, Zig, D, Nim, Odin, V, Hare"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Aaron Steven White", email = "aaronstevenwhite@gmail.com" },
]
keywords = ["panproto", "tree-sitter", "grammar", "systems"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]
dependencies = [
    "panproto>=0.70,<0.71",
]

[project.entry-points."panproto.grammars"]
systems = "panproto_grammars_systems._impl"

[project.urls]
Homepage = "https://github.com/panproto/panproto"
Issues = "https://github.com/panproto/panproto/issues"

[tool.maturin]
manifest-path = "../../crates/panproto-grammars-systems/Cargo.toml"
python-source = "src"
module-name = "panproto_grammars_systems._impl"
features = ["pyo3/extension-module"]
