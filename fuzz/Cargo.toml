# The fuzz crate is deliberately NOT a member of the root workspace.
#
# The empty `[workspace]` table below makes this file its own workspace
# root. Two gates depend on that:
#
#   * `cargo clippy --workspace --all-targets -- -D warnings` runs under
#     `unsafe_code = "deny"`, and a `#![no_main]` libfuzzer target
#     cannot satisfy that lint.
#   * `.github/scripts/check_version_consistency.py` requires every
#     member manifest to inherit `version.workspace = true`; a fuzz
#     crate carries its own throwaway version instead.
#
# Do not add "fuzz" to the root `[workspace] members`.
[package]
name = "panproto-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
panproto-mig = { path = "../crates/panproto-mig" }

[profile.release]
debug = 1

[[bin]]
name = "cost_algebra"
path = "fuzz_targets/cost_algebra.rs"
test = false
doc = false
bench = false
